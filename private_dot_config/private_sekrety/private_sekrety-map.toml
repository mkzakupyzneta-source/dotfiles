# ============================================================================
# sekrety-map.toml — SPIS NAZW, nie sekretów
# ============================================================================
# Ten plik mówi skryptowi `sekrety-odswiez`, KTÓRA pozycja w sejfie Bitwarden
# trafia do KTÓREJ zmiennej w KTÓRYM pliku env.
#
# ŻELAZNA ZASADA: tu NIE MA ani jednej wartości sekretu. Same nazwy.
# Wartości leżą wyłącznie w sejfie (https://vault.bitwarden.eu) i w plikach
# docelowych z prawami 600.
#
# Docelowe miejsce tego pliku: ~/.config/sekrety/sekrety-map.toml
# Źródło (repozytorium chezmoi): private_dot_config/private_sekrety/private_sekrety-map.toml
#
# ----------------------------------------------------------------------------
# JAK DOPISAĆ NOWĄ ZMIENNĄ (bez dotykania kodu skryptu)
# ----------------------------------------------------------------------------
# Doklej blok:
#
#   [[plik.zmienna]]
#   nazwa   = "MOJ_KLUCZ"            # nazwa zmiennej w pliku env
#   pozycja = "MOJ_KLUCZ"            # nazwa pozycji (item) w sejfie
#   pole    = "password"             # skąd wziąć wartość w tej pozycji
#
# pole:  "password" (domyślne) | "username" | "notes" | "totp"
#        albo "pole:NAZWA" — pole własne (custom field) pozycji
#
# stan:  "gotowe" (domyślne) — pobieramy z sejfu
#        "czeka"             — pozycja przewidziana, ale jeszcze nie ma jej
#                              w sejfie; skrypt ją POMIJA i wypisuje uwagę
#
# wartosc = "..."  — wartość wpisana wprost (tylko dla rzeczy, które NIE są
#                    sekretem: numery bibliotek, identyfikatory, adresy, ścieżki).
#                    Wyklucza się z `pozycja`. TO JEST JEDYNY sposób na stałą
#                    w pliku env — skrypt buduje plik OD NOWA z tej mapy i linie
#                    dopisane ręcznie na maszynie ZNIKAJĄ przy następnym
#                    uruchomieniu (od [320], 2026-09-03 opisane wprost).
#
# wieloliniowa = true — TYLKO dla sekretu, który naprawdę ma kilka linii (klucz
#                    PEM itp.). Domyślnie (bez tej opcji) skrypt skleja wartość
#                    w JEDNĄ linię: usuwa CR, złamania linii i białe znaki na
#                    krańcach — bo notatka wklejona z zawiniętego terminala dawała
#                    token w dwóch liniach ([320]). Z opcją: zapis w cudzysłowach
#                    podwójnych ze złamaniami jako `\n` — rozumieją to Docker
#                    Compose (env_file) i python-dotenv; powłoka (`source`) NIE.
#
# sciezka_wg_hosta — gdy JEDNA maszyna trzyma ten plik env w innym miejscu niż
#                    `sciezka` (np. usługa na serwerze mieszka pod /srv/...).
#                    Klucz = `hostname` tej maszyny (`hostname` w terminalu).
#                    Mapowanie zostaje IDENTYCZNE na wszystkich maszynach —
#                    to skrypt wybiera ścieżkę wg tego, na czym działa:
#
#   [plik.sciezka_wg_hosta]
#   "nazwa-hosta" = "/inna/sciezka/env"
#
# NOWY PLIK ENV = nowy blok [[plik]]. Nic w kodzie nie trzeba zmieniać.
# ============================================================================


# ============================================================================
# 1. Coach 2.0  →  ~/.coach/env
# ============================================================================
# Nazwy pozycji w sejfie są DOKŁADNIE takie, jak nazwy zmiennych z kontraktu
# Coacha §3c — kod ról Coacha szuka tych nazw.
# Folder w sejfie: "Coach 2.0"

[[plik]]
sciezka = "~/.coach/env"
opis    = "Coach 2.0 — Telegram (kontrakt §3c) + token Claude + sciezki (§3a)"

  # Na serwerze (OptiPlex) Coach 2.0 mieszka pod /srv/uslugi/coach-20/, nie
  # w katalogu domowym — nadpisanie ścieżki per hostname (klucz = `hostname`
  # tej maszyny). Gdy dojdzie kolejna maszyna z inną ścieżką, dopisz tu kolejny
  # wiersz — plik mapowania zostaje IDENTYCZNY na wszystkich maszynach.
  [plik.sciezka_wg_hosta]
  "mk-OptiPlex-7050" = "/srv/uslugi/coach-20/.env"

  [[plik.zmienna]]
  nazwa   = "COACH_TG_BOT_TOKEN_UX"
  pozycja = "COACH_TG_BOT_TOKEN_UX"
  pole    = "notes"

  [[plik.zmienna]]
  nazwa   = "COACH_TG_POLL_TOKEN_UX"
  pozycja = "COACH_TG_POLL_TOKEN_UX"
  pole    = "notes"

  [[plik.zmienna]]
  nazwa   = "COACH_TG_CHAT_ID_UX"
  pozycja = "COACH_TG_CHAT_ID_UX"
  pole    = "notes"
  # to numer rozmowy, nie sekret — ale w sejfie leży w komplecie z resztą

  # --- mózg Coacha 2.0: Claude Code CLI w kontenerze (2026-09-03, [320]) ---
  # Sejf: Bezpieczna notatka, folder "Coach 2.0", nazwa = nazwa zmiennej.
  # Skrypt skleja wartość w jedną linię (notatka bywa wklejona z zawinięciem).

  [[plik.zmienna]]
  nazwa   = "CLAUDE_CODE_OAUTH_TOKEN"
  pozycja = "CLAUDE_CODE_OAUTH_TOKEN"
  pole    = "notes"

  # --- ścieżki Coacha 2.0 (rejestr lokalizacji, kontrakt §3a) — NIE sekrety ---
  # Wartości wprost, bo skrypt buduje plik od nowa i ręczne dopiski giną.
  # Przeniesione z jednorazowej mapy Architekta Coacha z 2026-09-03.
  # COACH_OPTIPLEX_HOST = adres serwera w Tailscale (wartość zdjęta z ~/.coach/env
  # na HP, gdzie była dopisana ręcznie); na serwerze wskazuje jego własny adres.

  [[plik.zmienna]]
  nazwa   = "COACH_SHARED"
  wartosc = "/home/mk/AI-katalog-roboczy/11_Home-Assistant/Coach_shared"

  [[plik.zmienna]]
  nazwa   = "COACH_STAN_DIR"
  wartosc = "/srv/dane/coach-20/stan"

  [[plik.zmienna]]
  nazwa   = "COACH_LOGI_DIR"
  wartosc = "/srv/logi/coach-20"

  [[plik.zmienna]]
  nazwa   = "COACH_OPTIPLEX_HOST"
  wartosc = "100.110.113.13"

  # --- USUNIĘTE 2026-09-03 (decyzja usera [179]) ---
  # COACH_TG_BOT_TOKEN_SHADOW, HA_URL, HA_TOKEN, SAMBA_USER, SAMBA_PASS — pozycje
  # Wyse / Coacha 1.0. Coach 2.0 ich nie używa (niezależny od Wyse i HA, spec §1).
  # Pozycje w sejfie ZOSTAJĄ (nie rotowane, tylko wyjęte z tego pliku). Jeśli sesja
  # Coacha 1.0 na stacji ich potrzebuje — osobny blok [[plik]] z inną ścieżką,
  # decyzja Architekta/usera; NIE dopisywać ich z powrotem tutaj.



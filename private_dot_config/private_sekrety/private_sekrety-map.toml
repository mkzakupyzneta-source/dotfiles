# ============================================================================
# sekrety-map.toml — SPIS NAZW, nie sekretów
# ============================================================================
# Ten plik mówi skryptowi `sekrety-odswiez`, KTÓRA pozycja w sejfie Bitwarden
# trafia do KTÓREJ zmiennej w KTÓRYM pliku env.
#
# ŻELAZNA ZASADA: tu NIE MA ani jednej wartości sekretu. Same nazwy.
# Wartości leżą wyłącznie w sejfie (https://vault.bitwarden.eu) i w plikach
# docelowych z prawami 600.
#
# Docelowe miejsce tego pliku: ~/.config/sekrety/sekrety-map.toml
# Źródło (repozytorium chezmoi): private_dot_config/private_sekrety/sekrety-map.toml
#
# ----------------------------------------------------------------------------
# JAK DOPISAĆ NOWĄ ZMIENNĄ (bez dotykania kodu skryptu)
# ----------------------------------------------------------------------------
# Doklej blok:
#
#   [[plik.zmienna]]
#   nazwa   = "MOJ_KLUCZ"            # nazwa zmiennej w pliku env
#   pozycja = "MOJ_KLUCZ"            # nazwa pozycji (item) w sejfie
#   pole    = "password"             # skąd wziąć wartość w tej pozycji
#
# pole:  "password" (domyślne) | "username" | "notes" | "totp"
#        albo "pole:NAZWA" — pole własne (custom field) pozycji
#
# stan:  "gotowe" (domyślne) — pobieramy z sejfu
#        "czeka"             — pozycja przewidziana, ale jeszcze nie ma jej
#                              w sejfie; skrypt ją POMIJA i wypisuje uwagę
#
# wartosc = "..."  — wartość wpisana wprost (tylko dla rzeczy, które NIE są
#                    sekretem: numery bibliotek, identyfikatory, adresy).
#                    Wyklucza się z `pozycja`.
#
# sciezka_wg_hosta — gdy JEDNA maszyna trzyma ten plik env w innym miejscu niż
#                    `sciezka` (np. usługa na serwerze mieszka pod /srv/...).
#                    Klucz = `hostname` tej maszyny (`hostname` w terminalu).
#                    Mapowanie zostaje IDENTYCZNE na wszystkich maszynach —
#                    to skrypt wybiera ścieżkę wg tego, na czym działa:
#
#   [plik.sciezka_wg_hosta]
#   "nazwa-hosta" = "/inna/sciezka/env"
#
# NOWY PLIK ENV = nowy blok [[plik]]. Nic w kodzie nie trzeba zmieniać.
# ============================================================================


# ============================================================================
# 1. Coach 2.0  →  ~/.coach/env
# ============================================================================
# Nazwy pozycji w sejfie są DOKŁADNIE takie, jak nazwy zmiennych z kontraktu
# Coacha §3c — kod ról Coacha szuka tych nazw.
# Folder w sejfie: "Coach 2.0"

[[plik]]
sciezka = "~/.coach/env"
opis    = "Coach 2.0 — Telegram + dostep do Wyse (kontrakt §3c)"

  # Na serwerze (OptiPlex) Coach 2.0 mieszka pod /srv/uslugi/coach-dev/, nie
  # w katalogu domowym — nadpisanie ścieżki per hostname (klucz = `hostname`
  # tej maszyny). Gdy dojdzie kolejna maszyna z inną ścieżką, dopisz tu kolejny
  # wiersz — plik mapowania zostaje IDENTYCZNY na wszystkich maszynach.
  [plik.sciezka_wg_hosta]
  "mk-OptiPlex-7050" = "/srv/uslugi/coach-dev/.env"

  [[plik.zmienna]]
  nazwa   = "COACH_TG_BOT_TOKEN_SHADOW"
  pozycja = "COACH_TG_BOT_TOKEN_SHADOW"
  pole    = "notes"

  [[plik.zmienna]]
  nazwa   = "COACH_TG_BOT_TOKEN_UX"
  pozycja = "COACH_TG_BOT_TOKEN_UX"
  pole    = "notes"

  [[plik.zmienna]]
  nazwa   = "COACH_TG_POLL_TOKEN_UX"
  pozycja = "COACH_TG_POLL_TOKEN_UX"
  pole    = "notes"

  [[plik.zmienna]]
  nazwa   = "COACH_TG_CHAT_ID_UX"
  pozycja = "COACH_TG_CHAT_ID_UX"
  pole    = "notes"
  # to numer rozmowy, nie sekret — ale w sejfie leży w komplecie z resztą

  # --- Dostep do Wyse (Home Assistant + Samba), sprawa [161], 2026-08-24 ---
  # Te same nazwy uzywa Coach 1.0 (produkcja na Wyse) i Coach 2.0 — dlatego
  # jeden plik, nie dwa. Zrodlo wartosci: HP `%USERPROFILE%\.ha_credentials`
  # (na Vostro i serwerze tego pliku NIE MA) — user wpisuje do sejfu recznie.
  # Folder w sejfie: "Coach 2.0" (nazwy z kontraktu §3c, sekcja F planu sejfu).

  [[plik.zmienna]]
  nazwa   = "HA_URL"
  pozycja = "HA_URL"
  pole    = "notes"
  # adres panelu HA, nie sekret — idzie w komplecie

  [[plik.zmienna]]
  nazwa   = "HA_TOKEN"
  pozycja = "HA_TOKEN"
  pole    = "notes"
  # token dlugoterminowy HA; rotacja zalecana (plik z HP mogl byc w OneDrive)

  [[plik.zmienna]]
  nazwa   = "SAMBA_USER"
  pozycja = "SAMBA_USER"
  pole    = "notes"

  [[plik.zmienna]]
  nazwa   = "SAMBA_PASS"
  pozycja = "SAMBA_PASS"
  pole    = "notes"



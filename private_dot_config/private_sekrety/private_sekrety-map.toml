# CO STĄD USUNIĘTO 2026-08-29 (sprawa [270], obszar 7_Bezpieczenstwo)
# ============================================================================
# Decyzje usera przy porządkowaniu sejfu:
#   IEEE_API_KEY, PQAI_TOKEN, PERPLEXITY_API_KEY — „nie ma i nie będzie".
#       Dopóki tu stały, `sekrety-odswiez` kończył się kodem 1 i wypisywał
#       „brakuje pozycji w sejfie" (IEEE, PQAI) — to był fałszywy alarm.
#   Cały plik ~/.config/sekrety/zdalny-pulpit.env (zmienna VNC_HASLO) — usługa
#       `zdalny-pulpit` od [258a] działa BEZ hasła (x11vnc słucha tylko na
#       127.0.0.1, wejście przez tunel SSH). Linia `haslo_vnc:` wypadła też
#       z konwencji notatki maszyny.
#
# Mechanizmy `pozycja_wg_hosta` i `pole = "notatka:KLUCZ"` ZOSTAJĄ w skrypcie
# `sekrety-odswiez` — dziś nikt ich nie używa, ale to jedyny sposób na sekret
# inny na każdej maszynie; opis w nagłówku instrukcji skryptu.

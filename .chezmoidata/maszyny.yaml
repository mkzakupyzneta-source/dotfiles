# Profile maszyn — DANE dla chezmoi, nie kod. Sprawa [174], 2026-08-24.
#
# Po co: nie każda maszyna jest lustrem. Serwer (OptiPlex) ma dostać z tego
# repozytorium TYLKO warstwę wspólną (sekrety, dostępy, git), a nie pulpit
# i zestaw programów stacji. Zamiast drugiego mechanizmu — jeden mechanizm,
# w którym „co ta maszyna dostaje" jest daną.
#
# KTÓRA maszyna ma KTÓRY profil — NIE tutaj. To pole `profil` w bloku
# [[maszyna]] pliku lustra/maszyny.toml (jedna lista maszyn floty, nie dwie).
# Tutaj są tylko DEFINICJE profili + domyślny + wymuszenie.
#
# Jak to działa: .chezmoitemplates/profil ustala nazwę profilu tej maszyny,
# .chezmoiignore.tmpl bierze z `profile.<nazwa>` listę ścieżek. Profil opisuje się
# JEDNYM z dwóch sposobów — tym, który jest krótszy:
#   `tylko`  — lista dozwolonych ścieżek; wszystko spoza niej wykluczone.
#              Pusta lista `tylko` = maszyna dostaje WSZYSTKO (lustro).
#   `oprocz` — lista ścieżek do wykluczenia; reszta jedzie normalnie. Dla profilu,
#              który różni się od lustra kilkoma pozycjami, wypisywanie trzydziestu
#              dozwolonych ścieżek byłoby listą, której nikt nie zaktualizuje.
# Podanie obu naraz jest błędem (szablon przerywa z komunikatem).
#
# ⚠️ To jest tylko JEDNA strona profilu: KTÓRE PLIKI konfiguracyjne maszyna dostaje.
#    Druga strona — KTÓRE PROGRAMY jej dotyczą — mieszka w lustra/profile.toml
#    (czyta ją `lustro.py`; chezmoi i lustro to dwa różne programy, stąd dwa pliki).
#    Nazwy profili w obu plikach muszą być takie same.
#
# Nowy rodzaj maszyny (np. laptop dla dziecka, maszyna testowa) = nowy wpis
# w `profile` + `profil = "..."` przy maszynie w lustra/maszyny.toml. Bez zmian
# w szablonach.
#
# Testowanie profilu bez zmieniania danych (np. „pokaż mi, co dostałby serwer"):
#   chezmoi --config /tmp/x.toml managed
# gdzie /tmp/x.toml zawiera:  [data.maszyny]  profil_wymuszony = "serwer"
# (dane z pliku konfiguracyjnego są scalane z .chezmoidata — sprawdzone 24.08).

maszyny:
  # Profil dla maszyny, której nie ma w lustra/maszyny.toml albo która nie ma
  # tam pola `profil`. Stacja = pełne lustro (dotychczasowe zachowanie).
  profil_domyslny: stacja

  # Pusty = wyłączony. Ustawiony (tu albo w [data.maszyny] pliku konfiguracyjnego
  # chezmoi na maszynie) — wygrywa z lustra/maszyny.toml. Do testów i wyjątków.
  profil_wymuszony: ""

  profile:
    stacja:
      opis: "Stacja robocza — pełne lustro: pulpit, programy, skrypty, ustawienia."
      # Pusta lista = bez ograniczeń (wszystko z repozytorium, poza `lustra/`).
      tylko: []

    serwer:
      opis: "Serwer — tylko warstwa wspólna: sekrety, dostępy, git. Bez pulpitu i programów stacji."
      # Ścieżki DOCELOWE (względem katalogu domowego), tak jak pokazuje je
      # `chezmoi managed`. Katalogi nadrzędne dokłada szablon sam.
      tylko:
        - .gitconfig
        - bin/sekrety-odswiez
        - .config/sekrety/sekrety-map.toml
        - .config/ccstatusline/settings.json
        # [221] zdalny pulpit (27.08, obszar 2, decyzja usera: serwer tez ma miec podglad
        # ekranu): skrypt, usluga user i skrypt wlaczajacy. Pakiet x11vnc idzie osobno —
        # override "obecne" w lustra/statusy-pozycji.toml. UWAGA: .ssh/config i
        # .ssh/authorized_keys sa CELOWO poza serwerem — serwer ma jeden klucz RSA
        # (bez id_ed25519_dom / _github), szablon stacji by mu popsul GitHuba.
        #
        # [258i] 29.08 (obszar 5) — SPROSTOWANIE POMIARU: te trzy pozycje SA na liscie
        # od 27.08, wiec serwer dostaje DOKLADNIE TEN SAM `zdalny-pulpit.sh` co stacje,
        # razem ze zmiana [258a] (x11vnc tylko na 127.0.0.1, bez hasla). Powodem, dla
        # ktorego serwer 29.08 nadal chodzil na starej wersji, NIE byl profil, tylko brak
        # kroku `chezmoi apply` na serwerze: timer /etc/systemd/system/chezmoi-git-pull.*
        # robi wylacznie `git pull --rebase --autostash`, a `lustro sync --auto`
        # (lustro-sync-serwer.timer) nie stosuje konfiguracji. Zastosowanie na serwerze
        # nalezy do obszaru 1_Serwer.
        - bin/zdalny-pulpit.sh
        - .config/systemd/user/zdalny-pulpit.service
        - wlacz-zdalny-pulpit.sh
      # Świadomie POZA warstwą serwera (decyzja usera 24.08 + Architekt):
      #   .bashrc, .profile        — serwer ma własne, nie ryzykujemy nadpisania
      #   install-packages.sh      — lista programów stacji, nie serwera
      #   .config/* poza sekretami i paskiem stanu — kitty, wezterm, flameshot,
      #                              systemd/wygaszanie-ekranow, zrzuty GNOME
      #   bin/* poza sekrety-odswiez — skrypty pulpitu/OneDrive/sesji
      # .config/ccstatusline/settings.json dołączony 25.08 (decyzja usera [174a]):
      #   pasek stanu Claude Code ma być spójny też na serwerze.

    moc:
      opis: "Moc obliczeniowa na żądanie — maszyna liczy i jest obsługiwana zdalnie; bez pulpitu biurowego."
      # [284] 2026-08-30. Ta maszyna dostaje PRAWIE wszystko, co stacja — bo pracuje się
      # na niej przez SSH/tmux/VNC i potrzebuje tych samych dostępów, sekretów, ustawień
      # gita, paska stanu Claude Code, usług Transkryptora i skryptów `bin/`. Różnica
      # dotyczy OneDrive'a: na maszynie „moc" nie ma konta OneDrive (patrz pole `onedrive`
      # w lustra/maszyny.toml), więc jego konfiguracja i skrypty dozoru byłyby tam martwe.
      # Dlatego `oprocz`, a nie `tylko` — inaczej ta lista musiałaby wyliczać wszystkie
      # trzydzieści ścieżek stacji i rozjeżdżałaby się przy każdej nowej.
      oprocz:
        - .config/onedrive-archiwum
        - .config/onedrive-archiwum/config
        - .config/onedrive-archiwum/sync_list
        - bin/onedrive-archiwum.sh
        - bin/onedrive-archiwum-dozor.sh

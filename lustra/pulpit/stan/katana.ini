# Migawka stanu pulpitu maszyny „katana” — plik GENEROWANY przez
# `lustro pulpit oddaj-stan` (kontrakt [209] 2.3.1). Czysta obserwacja: NIE jest
# wzorcem `pulpit wgraj` sama w sobie — o to, które gałęzie stąd trafiają do
# wspólnego pulpit.ini, decyduje pulpit/zrodla-galezi.toml + `pulpit skladaj`.
# Ścieżki wybrane w pulpit/dconf-lustro.txt; {{HOME}} = katalog domowy maszyny.

[org/gnome/desktop/background]
picture-options='none'
picture-uri=''
picture-uri-dark=''
primary-color='#000000'
secondary-color='#000000'

[org/gnome/desktop/input-sources]
sources=[('xkb', 'pl')]
xkb-options=@as []

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
enable-hot-corners=true
gtk-theme='Yaru-dark'
icon-theme='Yaru'
show-battery-percentage=true

[org/gnome/desktop/screensaver]
lock-enabled=false
picture-options='none'
picture-uri=''
primary-color='#000000'
secondary-color='#000000'

[org/gnome/desktop/session]
idle-delay=uint32 300

[org/gnome/desktop/wm/preferences]
button-layout=':minimize,maximize,close'

[org/gnome/nautilus/preferences]
default-folder-viewer='list-view'
migrated-gtk-settings=true
search-filter-time-type='last_modified'

[org/gnome/settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Super><Shift>s'
command='/usr/bin/flameshot gui -c -p {{HOME}}/Pictures/Screenshots'
name='Flameshot (Super+Shift+S)'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1]
binding='<Super><Shift>d'
command='{{HOME}}/bin/ocr-zrzut.sh'
name='OCR — tekst z zaznaczonego obszaru do schowka'

[org/gnome/shell]
disabled-extensions=@as []
enabled-extensions=['ding@rastersoft.com', 'ubuntu-dock@ubuntu.com', 'tiling-assistant@ubuntu.com', 'ubuntu-appindicators@ubuntu.com', 'Vitals@CoreCoding.com', 'gsconnect@andyholmes.github.io', 'gTile@vibou']
favorite-apps=['google-chrome.desktop', 'org.gnome.Nautilus.desktop', 'snap-store_snap-store.desktop', 'ailauncher.desktop']

[org/gnome/shell/extensions/dash-to-dock]
background-color='#000000'
background-opacity=1.0
custom-background-color=true
dash-max-icon-size=22
dock-fixed=true
dock-position='RIGHT'
extend-height=true
show-mounts=true
show-mounts-network=true
show-mounts-only-mounted=false
show-trash=true

[org/gnome/shell/keybindings]
show-screenshot-ui=['Print']

[org/gnome/terminal/legacy]
confirm-close=true

[org/gnome/terminal/legacy/profiles:]
default='b1dcc9dd-5262-4d8d-a863-c897e6d979b9'
list=['b1dcc9dd-5262-4d8d-a863-c897e6d979b9']

[org/gnome/terminal/legacy/profiles:/:b1dcc9dd-5262-4d8d-a863-c897e6d979b9]
background-color='rgb(12,12,12)'
bold-color-same-as-fg=true
foreground-color='rgb(204,204,204)'
palette=['rgb(12,12,12)', 'rgb(197,15,31)', 'rgb(19,161,14)', 'rgb(193,156,0)', 'rgb(0,55,218)', 'rgb(136,23,152)', 'rgb(58,150,221)', 'rgb(204,204,204)', 'rgb(118,118,118)', 'rgb(231,72,86)', 'rgb(22,198,12)', 'rgb(249,241,165)', 'rgb(59,120,255)', 'rgb(180,0,158)', 'rgb(97,214,214)', 'rgb(242,242,242)']
use-system-font=true
use-theme-colors=false

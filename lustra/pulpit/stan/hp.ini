# Migawka stanu pulpitu maszyny „hp” — plik GENEROWANY przez
# `lustro pulpit oddaj-stan` (kontrakt [209] 2.3.1). Czysta obserwacja: NIE jest
# wzorcem `pulpit wgraj` sama w sobie — o to, które gałęzie stąd trafiają do
# wspólnego pulpit.ini, decyduje pulpit/zrodla-galezi.toml + `pulpit skladaj`.
# Ścieżki wybrane w pulpit/dconf-lustro.txt; {{HOME}} = katalog domowy maszyny.

[org/gnome/desktop/background]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/ubuntu-wallpaper-d.png'
picture-uri-dark='file:///usr/share/backgrounds/ubuntu-wallpaper-d.png'
primary-color='#2c001e'
secondary-color='#2c001e'

[org/gnome/desktop/input-sources]
sources=[('xkb', 'pl')]
xkb-options=@as []

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
cursor-theme='DMZ-White'
enable-hot-corners=false
gtk-theme='Yaru-dark'
icon-theme='Yaru'
show-battery-percentage=true

[org/gnome/desktop/screensaver]
color-shading-type='solid'
lock-enabled=false
picture-options='zoom'
picture-uri='file:///usr/share/backgrounds/ubuntu-wallpaper-d.png'
primary-color='#2c001e'
secondary-color='#2c001e'

[org/gnome/desktop/session]
idle-delay=uint32 120

[org/gnome/desktop/wm/preferences]
button-layout=':minimize,maximize,close'
num-workspaces=4

[org/gnome/mutter]
dynamic-workspaces=true
experimental-features=@as []
workspaces-only-on-primary=false

[org/gnome/nautilus/preferences]
default-folder-viewer='list-view'
migrated-gtk-settings=true
search-filter-time-type='last_modified'

[org/gnome/settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/']

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Super><Shift>s'
command='/usr/bin/flameshot gui -c -p {{HOME}}/Desktop/Duperele/schowek'
name='Flameshot (Super+Shift+S)'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1]
binding='<Super><Shift>d'
command='{{HOME}}/bin/ocr-zrzut.sh'
name='OCR — tekst z zaznaczonego obszaru do schowka'

[org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2]
binding='<Super><Shift>h'
command='{{HOME}}/bin/dane-logowania wpisz'
name='Wpisz dane logowania z pęku kluczy (Super+Shift+H)'

[org/gnome/shell]
disabled-extensions=@as []
enabled-extensions=['ding@rastersoft.com', 'gTile@vibou', 'Vitals@CoreCoding.com', 'gsconnect@andyholmes.github.io', 'ubuntu-dock@ubuntu.com', 'tiling-assistant@ubuntu.com', 'ubuntu-appindicators@ubuntu.com', 'tailscale@joaophi.github.com']
favorite-apps=['google-chrome.desktop', 'org.gnome.Nautilus.desktop', 'snap-store_snap-store.desktop', 'ailauncher.desktop', 'panel-sieci.desktop']

[org/gnome/shell/extensions/dash-to-dock]
always-center-icons=false
animate-show-apps=true
background-color='#000000'
background-opacity=1.0
click-action='minimize'
custom-background-color=true
custom-theme-shrink=true
dash-max-icon-size=22
disable-overview-on-startup=true
dock-position='BOTTOM'
extend-height=true
height-fraction=0.90000000000000002
isolate-monitors=true
isolate-workspaces=false
multi-monitor=false
preferred-monitor=-2
preferred-monitor-by-connector='primary'
show-apps-always-in-the-edge=false
show-apps-at-top=true
show-favorites=true
show-mounts=true
show-mounts-network=true
show-mounts-only-mounted=false
show-trash=true

[org/gnome/shell/extensions/gsconnect/device/c7746d3650f644c1aca106b623fe8a98]
disabled-plugins=@as []

[org/gnome/shell/extensions/gsconnect/device/c7746d3650f644c1aca106b623fe8a98/plugin/battery]
custom-battery-notification=false
custom-battery-notification-value=uint32 80
full-battery-notification=false
low-battery-notification=true
send-statistics=false

[org/gnome/shell/extensions/gsconnect/device/c7746d3650f644c1aca106b623fe8a98/plugin/clipboard]
receive-content=true
send-content=true

[org/gnome/shell/extensions/gsconnect/device/c7746d3650f644c1aca106b623fe8a98/plugin/mpris]
share-players=true

[org/gnome/shell/extensions/gsconnect/device/c7746d3650f644c1aca106b623fe8a98/plugin/notification]
send-active=true
send-notifications=true

[org/gnome/shell/extensions/gsconnect/device/c7746d3650f644c1aca106b623fe8a98/plugin/runcommand]
command-list={'blokada-ekranu': <{'name': 'Zablokuj ekran', 'command': 'dbus-send --session --dest=org.gnome.ScreenSaver --type=method_call /org/gnome/ScreenSaver org.gnome.ScreenSaver.Lock'}>, 'zrzut-ekranu': <{'name': 'Zrzut ekranu', 'command': '/usr/bin/flameshot full -p {{HOME}}/Desktop/Duperele/schowek'}>}

[org/gnome/shell/extensions/gsconnect/device/c7746d3650f644c1aca106b623fe8a98/plugin/sftp]
automount=true

[org/gnome/shell/extensions/gsconnect/device/c7746d3650f644c1aca106b623fe8a98/plugin/share]
launch-urls=false
receive-directory='{{HOME}}/Downloads'
receive-files=true

[org/gnome/shell/extensions/gsconnect/device/c7746d3650f644c1aca106b623fe8a98/plugin/sms]
legacy-sms=false

[org/gnome/shell/extensions/gsconnect/device/c7746d3650f644c1aca106b623fe8a98/plugin/systemvolume]
share-sinks=true

[org/gnome/shell/extensions/vitals]
hot-sensors=['_memory_usage_', '_processor_usage_', '_gpu#1_utilization_', '{{TEMP_CPU}}', '_temperature_gpu_', '__network-tx_max__', '_battery_power_rate_']

[org/gnome/shell/keybindings]
show-screenshot-ui=['Print']

[org/gnome/terminal/legacy]
confirm-close=true

[org/gnome/terminal/legacy/profiles:/:b1dcc9dd-5262-4d8d-a863-c897e6d979b9]
background-color='rgb(12,12,12)'
bold-color-same-as-fg=true
foreground-color='rgb(204,204,204)'
palette=['rgb(12,12,12)', 'rgb(197,15,31)', 'rgb(19,161,14)', 'rgb(193,156,0)', 'rgb(0,55,218)', 'rgb(136,23,152)', 'rgb(58,150,221)', 'rgb(204,204,204)', 'rgb(118,118,118)', 'rgb(231,72,86)', 'rgb(22,198,12)', 'rgb(249,241,165)', 'rgb(59,120,255)', 'rgb(180,0,158)', 'rgb(97,214,214)', 'rgb(242,242,242)']
use-system-font=true
use-theme-colors=false

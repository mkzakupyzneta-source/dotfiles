# Ustawienia pulpitu GNOME objęte lustrem — plik GENEROWANY przez lustro.py.
# Ścieżki wybrane w pulpit/dconf-lustro.txt; {{HOME}} = katalog domowy maszyny.
# Inne {{ZNACZNIKI}} = wartości zależne od sprzętu maszyny — pulpit/znaczniki-maszyn.toml ([291]).
# Klucze przejęte przez rozszerzenia GNOME są POZA lustrem — patrz
# pulpit/dconf-rozszerzenia.txt (naprawa fałszywego alarmu z 23.08).
# Format zgodny z `dconf dump /` — do wczytania: `lustro pulpit wgraj`
# (robi kopię poprzedniego stanu przed nadpisaniem — spec 8.11).
#
# ⚠️ GAŁĄŹ `ubuntu-2604`, sprawa [423] (2026-09-14): ten plik jest ŚWIEŻYM ZRZUTEM
# ŻYWEGO STANU MASZYNY HP z 14.09 wieczorem — pełne lustro pulpitu, razem z ustawieniami
# rozszerzeń (Dash to Panel, Tiling Shell, Vitals, Caffeine, Desktop Cube, DING).
# Zastępuje poprzednią zawartość (Dash to Dock, stary Vostro). Trzy ręczne poprawki
# po zrzucie, każda uzasadniona w danych obok:
#   • tapeta wskazuje WŁASNĄ KOPIĘ pliku (~/.local/share/tapety/…, wożoną przez chezmoi),
#     a nie plik z pakietu `ubuntu-wallpapers` — inne wydanie Ubuntu ma inną tapetę (spec 8.6);
#   • skrót `custom2` (Super+Shift+H → ~/bin/dane-logowania) usunięty razem ze skryptem,
#     który opierał się na xdotool (X11) — przepis na zamiennik w lustra/lista-brakow-wayland.md;
#   • `disabled-extensions` zawiera dokładnie cztery pozycje profilu [418]
#     (bez zaszłości `forge@jmmaranan.com` z HP).


# Lista maszyn domowej sieci — DANE, nie kod.
#
# Czyta ją AI Launcher (12_Narzedzia-AI/AILauncher_V2/linux/ailauncher.py) przy KAŻDYM
# starcie, żeby pokazać listę „gdzie uruchomić Claude'a". Zmiana floty = zmiana TEGO pliku,
# launchera nikt nie rusza:
#   • nowa maszyna po bootstrapie dopisuje swój blok [[maszyna]] i robi `git push`,
#   • maszyna wycofana — blok znika.
#
# Plik leży w katalogu `lustra/`, który jest w `.chezmoiignore` — zostaje w repozytorium
# i NIE jest rozwijany do katalogu domowego. Launcher czyta go wprost ze ścieżki
# ~/.local/share/chezmoi/lustra/maszyny.toml (można nadpisać zmienną AILAUNCHER_MASZYNY).
#
# Pola bloku [[maszyna]]:
#   klucz              — krótki, stały identyfikator (bez spacji); używany w trybie tekstowym
#   nazwa              — co user widzi na liście
#   rola               — krótki opis funkcji maszyny w sieci, dla zakładki „Maszyny"
#                        panelu menadżera sieci [202] (obszar 1_Serwer, dodane 2026-08-26).
#                        Launcher tego pola nie czyta; brak pola = panel pokazuje "-".
#   nazwa_hosta        — `hostname` tej maszyny; po tym launcher poznaje, że to ON sam
#                        (wtedy uruchamia lokalnie, bez SSH)
#   host_lan           — adres w domowej sieci; launcher próbuje go PIERWSZEGO
#   host_tailscale     — nazwa w Tailscale (MagicDNS); próba druga
#   ip_tailscale       — adres 100.x Tailscale; próba trzecia
#   user               — konto systemowe do logowania po SSH
#   katalog_roboczy    — gdzie na tej maszynie leży AI-katalog-roboczy
#   dostepna_jako_cel  — czy wolno na niej URUCHAMIAĆ (false = maszyna tylko „skąd")
#   aktywna            — false = wpis-szkielet, launcher go nie pokazuje
#   uwagi              — dla człowieka
#   profil             — jak chezmoi traktuje tę maszynę (sprawa [174], 2026-08-24):
#                        "stacja" = pełne lustro, "serwer" = tylko warstwa wspólna
#                        (sekrety, dostępy, git). Definicje profili i lista, co który
#                        dostaje: .chezmoidata/maszyny.yaml. Brak pola = profil domyślny
#                        (stacja). Dopasowanie po `nazwa_hosta`, bez rozróżniania
#                        wielkości liter. Launcher tego pola nie czyta.
#   mac_lan            — adres MAC karty sieciowej kablowej, do budzenia przez sieć (WOL),
#                        sprawa [212]/E3a panelu menadżera sieci (obszar 1_Serwer, 2026-08-26).
#                        Puste = panel pokaże przycisk „obudź" wyszarzony. WOL działa TYLKO
#                        po kablu, w tej samej podsieci co serwer (patrz plan Architekta,
#                        „Ograniczenia fizyczne") — panel to sprawdza porównując `host_lan`
#                        tej maszyny z `host_lan` wpisu o `profil = "serwer"`.
#   nie_usypiac        — true = panel NIE pokazuje przycisku „uśpij" dla tej maszyny (zamiast
#                        niego adnotacja z `powod_nie_usypiac`). Wyjątek twardy, nie zgadywany
#                        z `uwagi` — dodane 2026-08-26 dla Katany ([189]).
#   powod_nie_usypiac  — tekst adnotacji pokazywany zamiast przycisku, gdy `nie_usypiac = true`.
#
# Bloki [[maszyna.konto]] — konta Claude Code NA TEJ maszynie (etykieta + katalog ustawień;
# pusty katalog = domyślny ~/.claude). Przypisanie „etykieta → adres e-mail" bywa na każdej
# maszynie INNE, dlatego siedzi przy maszynie, a nie w programie. Maszyna lokalna kont tu
# nie ma — dla niej źródłem prawdy jest ~/.config/ailauncher/settings.json (żeby nie było
# dwóch list, które się rozjadą).
#
# Stan zapisu: 2026-08-23, sprawa [132], obszar 10_Siec_domowa/6_Dostep_zdalny.

wersja = 1

# ── Vostro — stacja robocza (Ubuntu 24.04) ──────────────────────────────────────
# Poprawka 2026-08-26 (obszar 1_Serwer, sprawa [202], zgłoszenie usera): pole
# "nazwa" miało wpisane na sztywno "(ta maszyna)" — zostało tak zapisane przy
# zakładaniu pliku (commit 1b07e23), najwyraźniej z sesji uruchomionej NA Vostro,
# gdzie to zdanie było prawdziwe lokalnie. Plik jest jednak WSPÓLNY (repo chezmoi,
# ten sam wpis widzą wszystkie maszyny) — etykieta "ta maszyna" pokazywała się w
# panelu identycznie niezależnie od tego, kto naprawdę patrzy (np. z Katany).
# "Czyja to maszyna" nie może być zaszyte w danych ogólnych — panel musi liczyć
# to w locie z adresu, z którego przyszło żądanie (patrz app.py, funkcja
# dopasuj_zrodlo).
[[maszyna]]
klucz = "vostro"
nazwa = "Vostro"
rola = "Stacja robocza"
nazwa_hosta = "vostro"
host_lan = "192.168.1.60"
host_tailscale = "vostro"
ip_tailscale = "100.100.178.56"
user = "mk"
katalog_roboczy = "/home/mk/AI-katalog-roboczy"
dostepna_jako_cel = true
aktywna = true
profil = "stacja"
mac_lan = "54:bf:64:31:4d:b7"
uwagi = """
Stacja robocza. Konta Claude bierzemy z ~/.config/ailauncher/settings.json.
Tailscale na Vostro jeszcze NIE zainstalowany (stan 2026-08-23) — pola tailscale puste.
Do wpisania po instalacji: openssh-server + reguła zapory, jeśli Vostro ma być też celem
z innych maszyn.
[212]/E3a (2026-08-26, obszar 1_Serwer): `host_lan` i `mac_lan` uzupełnione — zmierzone
po SSH z serwera (`ip -4 -o addr show`, `ip -o link show`, interfejs kablowy `enp59s0`,
UP+LOWER_UP w chwili pomiaru). BIOS/system: obsługa Wake-on-LAN w BIOS-ie NIEZWERYFIKOWANA
(`ethtool` na Vostro nie ma reguły sudoers NOPASSWD, nie wymuszałem hasła) — do sprawdzenia
przy okazji fizycznej wizyty."""


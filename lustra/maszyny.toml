sprawa [149]): `tailscale status` na Vostro pokazuje ten węzeł, `tailscale ping` zwraca
pong bezpośrednio przez 192.168.1.49:41641 (2-3 ms).
`mac_lan` zmierzony lokalnie 2026-08-26 (`ip -o link show enp0s31f6`); `ethtool enp0s31f6`
potwierdza `Wake-on: g` (WOL przez magic packet włączony w systemie). Serwer sam siebie
nie budzi (jest jedyną maszyną 24/7) — pole tu tylko dla kompletności danych.
2026-08-26 (obszar 5, dziura dzienników): serwer DOSTAŁ własny dziennik
(`dziennik/serwer.jsonl`, zasiany przez `zasiew-uzupelniajacy.py --maszyna serwer`

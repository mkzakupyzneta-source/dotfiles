# Lista maszyn domowej sieci — DANE, nie kod.
#
# Czyta ją AI Launcher (12_Narzedzia-AI/AILauncher_V2/linux/ailauncher.py) przy KAŻDYM
# starcie, żeby pokazać listę „gdzie uruchomić Claude'a". Zmiana floty = zmiana TEGO pliku,
# launchera nikt nie rusza:
#   • nowa maszyna po bootstrapie dopisuje swój blok [[maszyna]] i robi `git push`,
#   • maszyna wycofana — blok znika.
#
# Plik leży w katalogu `lustra/`, który jest w `.chezmoiignore` — zostaje w repozytorium
# i NIE jest rozwijany do katalogu domowego. Launcher czyta go wprost ze ścieżki
# ~/.local/share/chezmoi/lustra/maszyny.toml (można nadpisać zmienną AILAUNCHER_MASZYNY).
#
# Pola bloku [[maszyna]]:
#   klucz              — krótki, stały identyfikator (bez spacji); używany w trybie tekstowym
#   nazwa              — co user widzi na liście
#   rola               — krótki opis funkcji maszyny w sieci, dla zakładki „Maszyny"
#                        panelu menadżera sieci [202] (obszar 1_Serwer, dodane 2026-08-26).
#                        Launcher tego pola nie czyta; brak pola = panel pokazuje "-".
#   nazwa_hosta        — `hostname` tej maszyny; po tym launcher poznaje, że to ON sam
#                        (wtedy uruchamia lokalnie, bez SSH)
#   host_lan           — adres w domowej sieci; launcher próbuje go PIERWSZEGO
#   host_tailscale     — nazwa w Tailscale (MagicDNS); próba druga
#   ip_tailscale       — adres 100.x Tailscale; próba trzecia
#   user               — konto systemowe do logowania po SSH
#   katalog_roboczy    — gdzie na tej maszynie leży AI-katalog-roboczy
#   dostepna_jako_cel  — czy wolno na niej URUCHAMIAĆ (false = maszyna tylko „skąd")
#   aktywna            — false = wpis-szkielet, launcher go nie pokazuje
#   uwagi              — dla człowieka
#   profil             — ROLA maszyny w mechanizmie, jedna dana o dwóch skutkach
#                        (sprawa [174] 2026-08-24, rozszerzona [284] 2026-08-30):
#                          "stacja" = pełne lustro (pulpit, programy, ustawienia),
#                          "serwer" = tylko warstwa wspólna (sekrety, dostępy, git),
#                          "moc"    = moc obliczeniowa na żądanie: maszyna liczy i jest
#                                     obsługiwana zdalnie, bez pulpitu biurowego.
#                        Nowa rola = nowa wartość + po jednym bloku w dwóch plikach
#                        definicji; kodu nikt nie rusza:
#                          • KTÓRE PLIKI konfiguracyjne dostaje → .chezmoidata/maszyny.yaml,
#                          • KTÓRE PROGRAMY jej dotyczą        → lustra/profile.toml.
#                        Brak pola = "stacja". Dopasowanie po `nazwa_hosta` (chezmoi)
#                        albo po `klucz` (lustro), bez rozróżniania wielkości liter.
#                        Launcher tego pola nie czyta.
#   onedrive           — jak ta maszyna używa OneDrive'a ([279a], 2026-08-30). DANA, bo
#                        pakiet apt `onedrive` włącza swoją usługę WSZYSTKIM użytkownikom
#                        maszyny, na której go zainstalowano — także takiej, na której
#                        nikt się do OneDrive'a nie loguje (wtedy klient przy każdym starcie
#                        sesji otwiera przeglądarkę na stronie logowania Microsoftu).
#                          "brak"           — nie ma tu konta OneDrive → usługa `onedrive.service`
#                                             ma być ZAMASKOWANA (robi to
#                                             run_onchange_after_onedrive-wg-danych.sh.tmpl,
#                                             `systemctl --user mask`, bez roota),
#                          "konto-osobiste" — maszyna korzysta z OneDrive'a → maska zdejmowana.
#                        Brak pola = nie wiemy, nic nie ruszamy. Nowy sposób = nowa wartość.
#   mac_lan            — adres MAC karty sieciowej kablowej, do budzenia przez sieć (WOL),
#                        sprawa [212]/E3a panelu menadżera sieci (obszar 1_Serwer, 2026-08-26).
#                        Puste = panel pokaże przycisk „obudź" wyszarzony. WOL działa TYLKO
#                        po kablu, w tej samej podsieci co serwer (patrz plan Architekta,
#                        „Ograniczenia fizyczne") — panel to sprawdza porównując `host_lan`
#                        tej maszyny z `host_lan` wpisu o `profil = "serwer"`.
#   nie_usypiac        — true = panel NIE pokazuje przycisku „uśpij" dla tej maszyny (zamiast
#                        niego adnotacja z `powod_nie_usypiac`). Wyjątek twardy, nie zgadywany
#                        z `uwagi` — dodane 2026-08-26 dla Katany ([189]).
#   powod_nie_usypiac  — tekst adnotacji pokazywany zamiast przycisku, gdy `nie_usypiac = true`.
#   wolno_wylaczac     — true = panel POKAZUJE przycisk „wyłącz" (pełne wyłączenie maszyny przez
#                        SSH, `sudo -n systemctl poweroff`). Sprawa [267c], 2026-08-29.
#                        ⚠️ BIEGUNOWOŚĆ ODWROTNA NIŻ `nie_usypiac` — i tak ma być:
#                        uśpienie jest odwracalne (domyślnie wolno, `nie_usypiac` to wyjątek),
#                        a wyłączenie NIE jest (maszyna bez fizycznego dostępu zostaje wyłączona
#                        do najbliższej wizyty), więc BRAK POLA = BRAK ZGODY. Kontrakt panelu
#                        (obszar 1_Serwer): `not maszyna.get("wolno_wylaczac")` → przycisk
#                        wyszarzony z adnotacją.
#                        Maszyna z `wolno_wylaczac = true` potrzebuje też reguły sudo bez hasła
#                        na samo wyłączanie — zakłada ją `lustra/zasilanie-stacja.sh`
#                        (plik /etc/sudoers.d/91-lustro-zasilanie), wołany z K3b automatu
#                        nowej stacji; na maszynie postawionej wcześniej trzeba go raz uruchomić
#                        ręcznie z `--wykonaj` (wymaga hasła sudo).
#   powod_nie_wylaczac — tekst adnotacji pokazywany zamiast przycisku, gdy pola `wolno_wylaczac`
#                        nie ma (opcjonalny; bez niego panel pisze zdanie domyślne).
#   wolno_hibernowac   — true = panel POKAZUJE przycisk „hibernuj" (zapis pamięci na dysk
#                        i pełne wyłączenie; powrót do dokładnie tych samych okien). Sprawa [290],
#                        2026-08-30.
#                        ⚠️ BIEGUNOWOŚĆ TAKA SAMA JAK `wolno_wylaczac`, i tak ma być: BRAK POLA
#                        = BRAK ZGODY. Hibernacja jest nieodwracalna zdalnie tak samo jak
#                        wyłączenie (maszyna gaśnie), a na maszynie źle przygotowanej potrafi
#                        skończyć się utratą sesji zamiast jej zapisaniem. Kontrakt panelu
#                        (obszar 1_Serwer): `not maszyna.get("wolno_hibernowac")` → przycisk
#                        wyszarzony z adnotacją.
#                        Wpisujemy WYŁĄCZNIE tam, gdzie hibernacja została ZMIERZONA — nie tam,
#                        gdzie „powinna działać". Warunki, które trzeba spełnić (Vostro,
#                        zmierzone 2026-08-30): Secure Boot wyłączony, `secretmem.enable=0`
#                        w wierszu poleceń jądra, obszar wymiany (swap) większy od pamięci
#                        (tam: 34 GB na /data), karta sieciowa z włączonym `power/wakeup`
#                        (żeby dało się obudzić przez sieć).
#                        Maszyna z `wolno_hibernowac = true` potrzebuje też reguły sudo bez hasła
#                        na samo `systemctl hibernate` — zakłada ją `lustra/zasilanie-stacja.sh`
#                        (ta sama jedna linia w /etc/sudoers.d/91-lustro-zasilanie, co poweroff).
#   powod_nie_hibernowac — tekst adnotacji pokazywany zamiast przycisku, gdy pola
#                        `wolno_hibernowac` nie ma (opcjonalny; bez niego panel pisze zdanie
#                        domyślne).
#   klapa_zamkniecie   — CO SIĘ DZIEJE PO ZAMKNIĘCIU KLAPY tej maszyny. Sprawa [279], 2026-08-30.
#                        Trzy wartości — to DANE, nie kolumny; nowe zachowanie = nowa wartość:
#                          "usyp"         — domyślne zachowanie systemu: zamknięcie klapy usypia
#                                           od ręki. BRAK POLA = to samo (nic nie zmieniamy).
#                          "ekran-gasnie" — ekran gaśnie natychmiast, ale maszyna PRACUJE DALEJ;
#                                           usypia dopiero po `klapa_usyp_po_min` minutach, jeśli
#                                           klapa nadal jest zamknięta. Dla laptopa, który user
#                                           przenosi zamknięty między pokojami.
#                          "ignoruj"      — klapa nie robi NIC (maszyna pracuje z zamkniętą klapą
#                                           bez końca).
#                        Mechanizm: `lustra/zasilanie-stacja.sh --wykonaj` (root) zakłada albo
#                        zdejmuje drop-in /etc/systemd/logind.conf.d/50-lustro-klapa.conf
#                        (trzy klucze `HandleLidSwitch*=ignore`) — dla "ekran-gasnie" i "ignoruj"
#                        zakłada, dla "usyp" zdejmuje. Resztę pracy przy "ekran-gasnie" wykonuje
#                        usługa użytkownika `klapa-straznik.service` (wozi ją chezmoi, włącza
#                        `run_onchange_after_wlacz-klapa-straznik.sh.tmpl`); usługa sama czyta to
#                        pole i na maszynie z inną wartością kończy się od razu.
#   klapa_usyp_po_min  — po ilu minutach zamkniętej klapy strażnik usypia maszynę. Ma sens tylko
#                        przy `klapa_zamkniecie = "ekran-gasnie"`; 0 = nie usypiaj wcale.
#                        Brak pola = 5. Podłączony monitor zewnętrzny (dok) ODWOŁUJE odliczanie —
#                        praca na monitorach z zamkniętą klapą nie ma się kończyć uśpieniem.
#   klapa_otwarcie_budzi — false = otwarcie klapy ma NIE budzić uśpionej maszyny (budzi klawisz
#                        albo przycisk zasilania). Brak pola = true, czyli „zostaw, jak jest".
#                        Mechanizm: `zasilanie-stacja.sh` wyłącza źródło wybudzeń o nazwie
#                        zaczynającej się od `LID` w /proc/acpi/wakeup i utrwala to jednostką
#                        systemową `lustro-klapa-wakeup.service` (wpis w /proc/acpi/wakeup jest
#                        PRZEŁĄCZNIKIEM i po restarcie wraca do stanu z BIOS-u).
#                        ⚠️ Nie każda maszyna taki wpis MA — HP (zmierzone 2026-08-30) nie ma
#                        w /proc/acpi/wakeup żadnej pozycji LID*, a `PNP0C0D:00` (klapa) nie jest
#                        tam zarejestrowana jako źródło wybudzeń. Skrypt mówi to wprost i nic nie
#                        udaje, zamiast zgłaszać sukces.
#   system             — system operacyjny jako DANA (PRETTY_NAME z /etc/os-release), nie część
#                        nazwy ([252] uzup. 3, 2026-08-29 — HP po przesiadce nazywał się dalej
#                        „HP (Windows)"). Na stacjach wpisuje/odświeża K5 automatu
#                        (`stacja-dane.py maszyna-wpisz --system`) przy KAŻDYM biegu; `nazwa`
#                        i `rola` to pola usera — automat ich nie nadpisuje, gdy już są.
#                        Brak pola = nieznany (maszyny bez automatu: Wyse, Asus, poligon).
#   zdalny_pulpit      — LISTA dróg do żywego pulpitu tej maszyny ([258c], 2026-08-29, obszar 5).
#                        Wartości są DANYMI, nie kolumnami: "vnc" (x11vnc, port 5900 na pętli
#                        zwrotnej, wejście tunelem SSH — [258a]), "sunshine" (strumień gier/pulpitu,
#                        porty 47989/47990). Nowa droga (np. "rdp") = nowy element listy, nikt nie
#                        rusza kodu. PUSTA LISTA `[]` = maszyna nie ma zdalnego pulpitu.
#                        Dlaczego lista, a nie napis: panel menadżera sieci pyta o to pole
#                        `bool(maszyna.get("zdalny_pulpit"))` (app.py, `czy_ma_pulpit`), więc `[]`
#                        czyta się jako „nie ma", a `["vnc","sunshine"]` jako „ma" — i przy okazji
#                        widać, KTÓRE drogi; napis "brak" byłby dla `bool()` prawdą i włączyłby
#                        przycisk maszynie, która pulpitu nie ma.
#                        Pole ma PIERWSZEŃSTWO przed sondą SSH panelu — brak pola = panel sonduje
#                        port 5900 na żywo.
#
# Bloki [[maszyna.karta]] — KARTY SIECIOWE tej maszyny ([285], 2026-08-30).
# Maszyna z jedną kartą to szczególny przypadek, nie reguła: HP i Katana mają po dwie
# wbudowane (kabel + Wi-Fi), a do tego przejściówki USB i porty w doku. Dopóki dana
# „adres maszyny" była POJEDYNCZA, ktoś musiał wybierać, którą kartę opisuje `host_lan`
# i `mac_lan` — i 30.08 wyszło, że przy HP wybrano źle (w `mac_lan` siedział MAC Wi-Fi,
# a budzenie przez sieć działa WYŁĄCZNIE po kablu). Karty są więc listą, a nie polem.
#   nazwa    — nazwa interfejsu w systemie (`ip -br link`), np. "enp2s0f0", "wlp4s0"
#   rodzaj   — DANA, nie kolumna; nowy rodzaj sprzętu = nowa wartość, bez zmian w kodzie:
#              "kabel"   — wbudowana karta ethernet,
#              "wifi"    — karta bezprzewodowa,
#              "usb-eth" — przejściówka USB→Ethernet,
#              "dok"     — port ethernet w stacji dokującej (znika razem z dokiem),
#              "nieznany"— wiemy, że karta jest (mamy MAC), nie wiemy jaka.
#   mac      — adres sprzętowy karty. Pusty = niezmierzony (np. dok odpięty).
#   adres    — adres IPv4 w domowej sieci. Pusty = karta nigdy nie dostała dzierżawy.
#   budzenie — czy TĄ kartą wolno budzić maszynę przez sieć (WOL). Prawdziwe najwyżej dla
#              JEDNEJ karty maszyny i praktycznie tylko dla rodzaju "kabel" — Wi-Fi
#              magic packetu nie odbierze. Brak pola = false.
# Rezerwacje adresów w routerze dla tych kart: 6_Dostep_zdalny/rezerwacje-dhcp-2026-08-30.md.
#
# ⚠️ `host_lan` i `mac_lan` ZOSTAJĄ — to SKRÓT „karta główna" dla czytelników, którzy
# pytają o jeden adres i jeden MAC (panel menadżera sieci obszaru 1 czyta dokładnie te
# trzy pola: `host_lan`, `mac_lan`, `ip_tailscale`). Kontrakt skrótu:
#   `mac_lan`  = `mac` karty z `budzenie = true` (czym budzić),
#   `host_lan` = `adres` karty, pod którą maszyna normalnie odpowiada na SSH — NIE musi
#                to być ta sama karta (HP: budzimy kablem .17, ale `ssh hp` chodzi po
#                Wi-Fi na .65).
# Docelowo panel ma pingować WSZYSTKIE adresy z listy kart i budzić kartę z `budzenie`
# — zgłoszone obszarowi 1 przez „DO ARCHITEKTA".
#
# Bloki [[maszyna.konto]] — konta Claude Code NA TEJ maszynie (etykieta + katalog ustawień;
# pusty katalog = domyślny ~/.claude). Przypisanie „etykieta → adres e-mail" bywa na każdej
# maszynie INNE, dlatego siedzi przy maszynie, a nie w programie. Maszyna lokalna kont tu
# nie ma — dla niej źródłem prawdy jest ~/.config/ailauncher/settings.json (żeby nie było
# dwóch list, które się rozjadą).
#
# Stan zapisu: 2026-08-23, sprawa [132], obszar 10_Siec_domowa/6_Dostep_zdalny.

wersja = 1

# ── Vostro — stacja robocza (Ubuntu 24.04) ──────────────────────────────────────
# Poprawka 2026-08-26 (obszar 1_Serwer, sprawa [202], zgłoszenie usera): pole
# "nazwa" miało wpisane na sztywno "(ta maszyna)" — zostało tak zapisane przy
# zakładaniu pliku (commit 1b07e23), najwyraźniej z sesji uruchomionej NA Vostro,
# gdzie to zdanie było prawdziwe lokalnie. Plik jest jednak WSPÓLNY (repo chezmoi,
# ten sam wpis widzą wszystkie maszyny) — etykieta "ta maszyna" pokazywała się w
# panelu identycznie niezależnie od tego, kto naprawdę patrzy (np. z Katany).
# "Czyja to maszyna" nie może być zaszyte w danych ogólnych — panel musi liczyć
# to w locie z adresu, z którego przyszło żądanie (patrz app.py, funkcja
# dopasuj_zrodlo).
[[maszyna]]
klucz = "vostro"
nazwa = "Vostro"
rola = "Stacja robocza"
system = "Ubuntu 24.04"  # wpisane ręcznie 2026-08-29 (bez pomiaru poziomu łatki); K5 nie biegł na Vostro
nazwa_hosta = "vostro"
host_lan = "192.168.1.60"
host_tailscale = "vostro"
ip_tailscale = "100.100.178.56"
user = "mk"
katalog_roboczy = "/home/mk/AI-katalog-roboczy"
dostepna_jako_cel = true
aktywna = true
profil = "stacja"
onedrive = "konto-osobiste"   # [279a] — stan zastany; NIEZWERYFIKOWANY pomiarem (Vostro było
                              # wyłączone 30.08). Ta wartość NIC nie zmienia (maskę zakłada
                              # tylko "brak"), więc jest bezpieczna do czasu sprawdzenia.
mac_lan = "84:5c:31:13:d9:4c"  # [335] 06.09: karta do BUDZENIA = karta sieciowa MONITORA (patrz karty niżej)
zdalny_pulpit = ["vnc"]  # usluga `zdalny-pulpit` (x11vnc 127.0.0.1:5900) — [258c] 2026-08-29
wolno_hibernowac = false  # [323] 05.09 — hibernacja WYŁĄCZONA decyzją usera (swap 34 GB na /data
                          # skasowany, `resume=` zdjęte z GRUB i initramfs). Zdalne budzenie jest
                          # teraz przez WOL z uśpienia (karta monitora) + wake-on-AC z wyłączenia
                          # (cykl inteligentnego gniazdka, HA) — [335]. Historia hibernacji: [290] 30.08.
klapa_zamkniecie = "ignoruj"  # [279] 30.08 — Vostro pracuje ZAWSZE z zamkniętą klapą. Decyzja
                              # usera: „nic nie zmieniamy" — pole zapisuje STAN ZASTANY, żeby
                              # mechanizm go znał; NIKT nie uruchamiał tam `zasilanie-stacja.sh`.
                              # ⚠️ NIEZWERYFIKOWANE, czym to zachowanie jest dziś zrobione
                              # (drop-in logind? monitor zewnętrzny + HandleLidSwitchDocked?) —
                              # do sprawdzenia przy najbliższej sesji obszaru 2 na Vostro.
uwagi = """
Stacja robocza. Konta Claude bierzemy z ~/.config/ailauncher/settings.json.
Tailscale na Vostro jeszcze NIE zainstalowany (stan 2026-08-23) — pola tailscale puste.
Do wpisania po instalacji: openssh-server + reguła zapory, jeśli Vostro ma być też celem
z innych maszyn.
[212]/E3a (2026-08-26, obszar 1_Serwer): `host_lan` i `mac_lan` uzupełnione — zmierzone
po SSH z serwera (`ip -4 -o addr show`, `ip -o link show`, interfejs kablowy `enp59s0`,
UP+LOWER_UP w chwili pomiaru). BIOS/system: obsługa Wake-on-LAN w BIOS-ie NIEZWERYFIKOWANA
(`ethtool` na Vostro nie ma reguły sudoers NOPASSWD, nie wymuszałem hasła) — do sprawdzenia
przy okazji fizycznej wizyty."""

  [[maszyna.karta]]
  # Wbudowana karta (Killer E2400, sterownik `alx`) — NIE UMIE WOL w ogóle (zmierzone 06.09:
  # `ethtool` bez pola Wake-on), ani z wyłączenia, ani z uśpienia; wcześniejsze „WOL zadziałało"
  # [290] dotyczyło hibernacji. Od 06.09 kabel LAN PRZEPIĘTY do monitora — ta karta bez kabla.
  nazwa    = "enp59s0"
  rodzaj   = "kabel"
  mac      = "54:bf:64:31:4d:b7"
  adres    = ""
  budzenie = false

  [[maszyna.karta]]
  # KARTA DO BUDZENIA [335] (06.09): karta sieciowa wbudowana w monitor Dell U3225QE
  # (Realtek RTL8156, 2,5 Gbit, sterownik `r8152`), podłączona do laptopa przez USB 3.0 (USB-A).
  # WOL magic packet budzi Vostro Z UŚPIENIA (zmierzone: pakiet 00:06:14 → wstało 00:06:21);
  # z pełnego wyłączenia NIE (USB martwe w S5) — tam wake-on-AC przez gniazdko HA.
  # Wymaga: reguła udev `/etc/udev/rules.d/92-budzenie-vostro.rules` (uzbraja tylko szynę USB3,
  # huby monitora po ID, tę kartę i odbiornik Logitech; szyna USB2 monitora terkocze — rozbrojona)
  # + NetworkManager `802-3-ethernet.wake-on-lan magic` na „Wired connection 1". Zależność: LAN
  # Vostro istnieje tylko, gdy monitor ma prąd i USB wpięte. Rezerwacja DHCP .60 → ten MAC: [336].
  nazwa    = "enx845c3113d94c"
  rodzaj   = "kabel"
  mac      = "84:5c:31:13:d9:4c"
  adres    = "192.168.1.60"
  budzenie = true


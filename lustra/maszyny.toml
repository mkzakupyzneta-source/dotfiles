instalacji, i odwrotnie, serwer nie jest oceniany względem tego, co mają stacje.
To koryguje starą notatkę „serwer nie jest jeszcze objęty mechanizmem luster, więc
instalacji nie ma w dzienniku" — instalacje SĄ w dzienniku (dla wglądu w panelu

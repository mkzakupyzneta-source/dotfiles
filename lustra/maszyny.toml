uwagi = """
Serwer domowy — tu żyją długie sesje Claude'a (zawsze w tmux, żeby przetrwały zerwanie
łącza i żeby dało się podpiąć z drugiej maszyny). Klucz SSH z Vostro działa (2026-08-23).

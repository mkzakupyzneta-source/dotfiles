[[zrodlo]]
nazwa = "wezterm"
url = "https://apt.fury.io/wez/"
klucz_url = "https://apt.fury.io/wez/gpg.key"
klucz_format = "ascii"
keyring = "/usr/share/keyrings/wezterm-fury.gpg"
plik_listy = "/etc/apt/sources.list.d/wezterm.list"
linia_deb = "deb [signed-by=/usr/share/keyrings/wezterm-fury.gpg] https://apt.fury.io/wez/ * *"
pakiety = ["wezterm"]
uwagi = "Terminal WezTerm — OFICJALNE repo apt autora (Gemfury, metoda z dokumentacji wezterm dla Linuksa). Zweryfikowane 25.08 z Katany: gpg.key = HTTP 200, dists/*/Release = HTTP 200 (Codename: *, amd64). Dotąd instalowany RĘCZNIE z .deb 20240203-110809-5046fc22 (GitHub releases) na Vostro i Katanie — bez źródła nie miał aktualizacji; po dodaniu źródła apt aktualizuje. Uwaga: repo zawiera też pakiet wezterm-nightly — lustro wozi tylko `wezterm` (wydania)."

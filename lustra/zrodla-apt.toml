# Zewnętrzne źródła apt (repozytoria spoza Ubuntu) — DANE, nie kod.
#
# Po co: `apt install <program>` na nowej maszynie nic nie znajdzie, jeśli program
# pochodzi z repozytorium producenta (Fortinet, Tailscale, Google, Microsoft…).
# Ten plik mówi apce `lustro`, SKĄD apt ma wziąć dany pakiet i jak to źródło
# poprawnie dodać (klucz podpisu + linia `deb`). Zasada jak przy wykluczeniach:
# nowe źródło = nowy blok [[zrodlo]] tutaj, bez ruszania lustro.py.
#
# Co apka z tym robi (od 25.08, sprawa [176]):
#   • `lustro status`        — zgłasza źródła z tej listy, których NIE MA na maszynie
#                              (porównanie z /etc/apt/sources.list.d/ po polu `url`
#                              i sprawdzenie, czy plik `keyring` istnieje),
#   • `lustro dodaj <pakiet>` — jeśli pakiet stoi w polu `pakiety` jakiegoś źródła,
#                              a źródła nie ma, apka mówi to jasno i po pytaniu dodaje je
#                              JEDNYM skryptem pod JEDNYM sudo/pkexec (klucz + lista +
#                              apt-get update), dopiero potem instaluje pakiet.
#
# Pola bloku [[zrodlo]]:
#   nazwa        — krótki identyfikator (bez spacji)
#   url          — adres repozytorium; po nim apka poznaje, czy źródło już jest
#                  (szuka w każdym pliku .list / .sources w /etc/apt/sources.list.d/)
#   klucz_url    — skąd pobrać klucz podpisu repozytorium
#   klucz_format — "ascii" (blok -----BEGIN PGP…, trzeba `gpg --dearmor`)
#                  albo "binarny" (gotowy keyring, zapis wprost)
#   keyring      — dokąd klucz trafia (ścieżka w /usr/share/keyrings/)
#   plik_listy   — jaki plik apka tworzy w /etc/apt/sources.list.d/
#   linia_deb    — pełna linia `deb …` do tego pliku (format jednolinijkowy .list)
#   pakiety      — nazwy pakietów, które z tego źródła pochodzą (po tym `lustro dodaj`
#                  wie, że przed instalacją ma sprawdzić źródło)
#   pakiet_zaklada_zrodlo — true, gdy PAKIET SAM zakłada i utrzymuje swoje źródło apt
#                  po instalacji (Google Chrome robi to codziennym skryptem
#                  /opt/google/chrome/cron/google-chrome: zapisuje własny
#                  .sources ORAZ własny keyring). Wtedy wpis apki jest potrzebny
#                  WYŁĄCZNIE na pierwszą instalację, a potem jest zbędny i apt
#                  ostrzega „configured multiple times". Apka sprząta to sama —
#                  patrz `posprzataj_zdublowane_zrodla()` w lustro.py [257c].
#                  Domyślnie false.
#   uwagi        — dla człowieka
#
# Zastępniki w polach `url`, `klucz_url`, `linia_deb`:
#   {codename}       — nazwa wydania z /etc/os-release (VERSION_CODENAME, np. noble)
#   {wersja_systemu} — numer wydania z /etc/os-release (VERSION_ID, np. 24.04)
#                  Użyć TYLKO tam, gdzie producent naprawdę ma osobne repo per wydanie;
#                  jedni numerują je nazwą (Tailscale: `noble`), inni wersją
#                  (OBS/OneDrive: `xUbuntu_24.04`) — stąd dwa zastępniki.
#
# ⚠ Ubuntu Pro: jeszcze NIE spisane — włączone na Vostro ręcznie przed powstaniem
#   tego pliku. Dopisać, gdy będzie potrzebne apce. (Chrome / VS Code / WezTerm
#   spisane 25.08, poprawka 6 planu automatu; OneDrive 29.08 [257a].)
#
# ⚠ Format plików: apka pisze jednolinijkowe `.list` (pole `linia_deb`). Na Vostro
#   i Katanie Chrome i VS Code stoją jako `.sources` (deb822) pisane przez pakiety —
#   apka poznaje obecność źródła po `url` w KAŻDYM pliku .list/.sources, więc nie
#   zdubluje istniejącego; nowa maszyna dostanie `.list` o tej samej treści.

[[zrodlo]]
nazwa = "fortinet"
url = "https://repo.fortinet.com/repo/forticlient/7.4/ubuntu22/"
klucz_url = "https://repo.fortinet.com/repo/forticlient/7.4/ubuntu22/DEB-GPG-KEY"
klucz_format = "ascii"
keyring = "/usr/share/keyrings/repo.fortinet.com.gpg"
plik_listy = "/etc/apt/sources.list.d/repo.fortinet.com.list"
linia_deb = "deb [arch=amd64 signed-by=/usr/share/keyrings/repo.fortinet.com.gpg] https://repo.fortinet.com/repo/forticlient/7.4/ubuntu22/ stable non-free"
pakiety = ["forticlient"]
uwagi = "FortiClient (Linux) 7.4 — klient VPN [176]. Ścieżka `ubuntu22` obowiązuje TEŻ dla Ubuntu 24.04 wg oficjalnych release notes 7.4.7 (czerwiec 2026); sprawdzone 25.08: .../ubuntu22/dists/stable/Release = HTTP 200, .../ubuntu24/... = 404. Pakiet `forticlient` = pełny klient (VPN bez rejestracji w EMS)."

[[zrodlo]]
nazwa = "tailscale"
url = "https://pkgs.tailscale.com/stable/ubuntu"
klucz_url = "https://pkgs.tailscale.com/stable/ubuntu/{codename}.noarmor.gpg"
klucz_format = "binarny"
# keyring pod WŁASNĄ nazwą (27.08, test VM): oficjalny pakiet `tailscale` zależy od
# `tailscale-archive-keyring`, który kładzie /usr/share/keyrings/tailscale-archive-keyring.gpg —
# gdy ten sam plik należał do mikro-pakietu lustro-zrodlo-tailscale, dpkg odmawiał
# („trying to overwrite … also in package lustro-zrodlo-tailscale") i tailscale nie wchodził.
keyring = "/usr/share/keyrings/lustro-tailscale.gpg"
plik_listy = "/etc/apt/sources.list.d/tailscale.list"
linia_deb = "deb [signed-by=/usr/share/keyrings/lustro-tailscale.gpg] https://pkgs.tailscale.com/stable/ubuntu {codename} main"
pakiety = ["tailscale"]
uwagi = "Sieć prywatna między maszynami [149]. Na Vostro dodane 24.08 skryptem obszaru 6 (klucz i lista pobrane z pkgs.tailscale.com: noble.noarmor.gpg + noble.tailscale-keyring.list); ten blok odtwarza dokładnie to, co tam powstało — zweryfikowane 25.08 z /etc/apt/sources.list.d/tailscale.list."

[[zrodlo]]
nazwa = "google-chrome"
url = "https://dl.google.com/linux/chrome-stable/deb/"
klucz_url = "https://dl.google.com/linux/linux_signing_key.pub"
klucz_format = "ascii"
keyring = "/usr/share/keyrings/google-chrome.gpg"
plik_listy = "/etc/apt/sources.list.d/google-chrome.list"
linia_deb = "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome-stable/deb/ stable main"
pakiety = ["google-chrome-stable"]
# [257c] 29.08: pakiet SAM zakłada /etc/apt/sources.list.d/google-chrome.sources
# i /usr/share/keyrings/google-chrome.gpg (codzienny /opt/google/chrome/cron/google-chrome —
# sprawdzone na Vostro: ANI JEDEN z tych plików nie należy do żadnego pakietu dpkg,
# a mimo to oba istnieją i repo działa). Nasz `.list` po instalacji jest zbędny
# i produkuje ostrzeżenie apta „configured multiple times" — apka go sama zdejmuje.
pakiet_zaklada_zrodlo = true
uwagi = "Przeglądarka [126: synchronizacja przez konto Google, pliki NIE lustrzone]. Dane spisane 25.08 z /etc/apt/sources.list.d/google-chrome.sources na Katanie (kopia z Vostro): URI chrome-stable/deb, keyring google-chrome.gpg; klucz_url = HTTP 200 (sprawdzone 25.08 z Katany). Pakiet sam dba o swoje źródło po instalacji — apka potrzebuje bloku na PIERWSZĄ instalację na świeżej maszynie."

[[zrodlo]]
nazwa = "vscode"
url = "https://packages.microsoft.com/repos/code"
klucz_url = "https://packages.microsoft.com/keys/microsoft.asc"
klucz_format = "ascii"
keyring = "/usr/share/keyrings/microsoft.gpg"
plik_listy = "/etc/apt/sources.list.d/vscode.list"
linia_deb = "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/code stable main"
pakiety = ["code"]
uwagi = "VS Code [126: synchronizacja przez konto Microsoft/GitHub, pliki NIE lustrzone]. Dane spisane 25.08 z /etc/apt/sources.list.d/vscode.sources na Katanie (kopia z Vostro); klucz_url = HTTP 200 (sprawdzone 25.08 z Katany)."

[[zrodlo]]
nazwa = "wezterm"
url = "https://apt.fury.io/wez/"
klucz_url = "https://apt.fury.io/wez/gpg.key"
klucz_format = "ascii"
keyring = "/usr/share/keyrings/wezterm-fury.gpg"
plik_listy = "/etc/apt/sources.list.d/wezterm.list"
linia_deb = "deb [signed-by=/usr/share/keyrings/wezterm-fury.gpg] https://apt.fury.io/wez/ * *"
pakiety = ["wezterm"]
uwagi = "Terminal WezTerm — OFICJALNE repo apt autora (Gemfury, metoda z dokumentacji wezterm dla Linuksa). Zweryfikowane 25.08 z Katany: gpg.key = HTTP 200, dists/*/Release = HTTP 200 (Codename: *, amd64). Dotąd instalowany RĘCZNIE z .deb 20240203-110809-5046fc22 (GitHub releases) na Vostro i Katanie — bez źródła nie miał aktualizacji; po dodaniu źródła apt aktualizuje. Uwaga: repo zawiera też pakiet wezterm-nightly — lustro wozi tylko `wezterm` (wydania)."

[[zrodlo]]
nazwa = "onedrive"
url = "https://download.opensuse.org/repositories/home:/npreining:/debian-ubuntu-onedrive/xUbuntu_{wersja_systemu}/"
klucz_url = "https://download.opensuse.org/repositories/home:/npreining:/debian-ubuntu-onedrive/xUbuntu_{wersja_systemu}/Release.key"
klucz_format = "ascii"
keyring = "/usr/share/keyrings/obs-onedrive.gpg"
plik_listy = "/etc/apt/sources.list.d/onedrive.list"
linia_deb = "deb [arch=amd64 signed-by=/usr/share/keyrings/obs-onedrive.gpg] https://download.opensuse.org/repositories/home:/npreining:/debian-ubuntu-onedrive/xUbuntu_{wersja_systemu}/ ./"
pakiety = ["onedrive"]
uwagi = "Klient OneDrive (abraunegg) — repozytorium autora [257a, 29.08]. PO CO: Ubuntu 24.04 wozi w swoim archiwum wersję 2.4.25 z 2023 r., autor wydaje 2.5.x; Vostro ma 2.5.11 z tego repo od 20.08, HP i Katana stały na 2.4.25. Dane zweryfikowane 29.08 DWOMA drogami: (1) odczyt z Vostro (/etc/apt/sources.list.d/onedrive.list + apt-cache policy + odcisk klucza w /usr/share/keyrings/obs-onedrive.gpg = 63CE 457B 3C26 9D01 1BCD 74AB B8AC 39B0 876D 807E), (2) oficjalna instrukcja projektu docs/ubuntu-package-install.md (github.com/abraunegg/onedrive, gałąź master, pobrana 29.08) — ten sam adres repo, ta sama nazwa keyringu, ten sam plik listy. Klucz_url pobrany realnie: HTTP 200, 1101 B, odcisk IDENTYCZNY jak keyring na Vostro. Repo jest numerowane WERSJĄ wydania (xUbuntu_24.04), nie nazwą — stąd {wersja_systemu}. Uwaga: klucz OBS ma datę ważności 2026-10-24 — po tej dacie apt zacznie odrzucać repo i trzeba pobrać nowy Release.key (wystarczy `lustro` ponownie dodające źródło)."

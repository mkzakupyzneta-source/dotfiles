# Pozycje kanału `skrypt` — programy stawiane SKRYPTEM, nie menedżerem pakietów.
# DANE, nie kod ([252], decyzja usera 2026-08-29: „nawet jak ręcznie, to miało do lustra
# trafiać"). Apka (lustro.py) traktuje pozycję `skrypt` dokładnie jak apt/snap/flatpak:
# konsensus z dziennika, rozbieżności w `status`/`sync`, dociąganie przez `sync --auto`
# (timer co 60 min i K8 nowej stacji), księgowanie „jest, a w dzienniku brak" (wykryte),
# migawka inwentarza (kanał `skrypt`, nie `poza`). Ten plik mówi tylko, JAK poznać, że
# pozycja jest, i JAK ją postawić. Nowy program = nowy blok [[skrypt]] — kodu nikt nie rusza.
#
# Pola bloku [[skrypt]]:
#   id          — identyfikator pozycji (jak nazwa pakietu; tak stoi w dzienniku i migawce)
#   opis        — dla człowieka
#   sprawdz     — polecenie (bash); kod wyjścia 0 = pozycja OBECNA na maszynie.
#                 Ma sprawdzać WSZYSTKO, co instalacja zostawia (pliki, ikona) — wtedy
#                 stara/niepełna instalacja wychodzi jako rozbieżność i sync ją wyrównuje.
#   zainstaluj  — polecenie (bash) stawiające pozycję; uruchamiane NIEINTERAKTYWNIE
#                 (stdin z /dev/null, limit 15 min); jeśli woła `sudo apt`, na stacjach
#                 przejdzie bez hasła (reguła [194]). Pełne wyjście: ~/.local/share/lustro/skrypty/<id>.log
#   usun        — (opcjonalne) polecenie usuwające; bez niego `lustro usun` odsyła do ręki
#   wersja      — (opcjonalne) polecenie wypisujące wersję (pierwsza linia); brak = "?"
#   wymaga      — (opcjonalne) lista warunków, BEZ których instalacja jest ODKŁADANA z powodem
#                 (nie błąd — kolejny bieg timera spróbuje ponownie):
#                   "katalog-roboczy" = katalog roboczy tej maszyny (maszyny.toml →
#                                       `katalog_roboczy`) istnieje i nie jest pusty;
#                                       na nowej stacji pojawia się po synchronizacji
#                                       Syncthinga (K14, ~25 GB), więc K8 go nie ma
#                   "~/ścieżka" lub "/ścieżka" = ten plik/katalog istnieje (np. sam skrypt
#                                       instalacyjny — katalog może już być, plik jeszcze nie)
#   uwagi       — dla człowieka (po co, od kiedy, numer sprawy)
#
# Ścieżki pisz z `~` (rozwija bash) — plik jest wspólny dla wszystkich maszyn, nigdy `/home/mk`.
# Pozycja obowiązuje członków lustra (stacje) jak apt; wyjątki per maszyna → statusy-pozycji.toml.

[[skrypt]]
id         = "ailauncher"
opis       = "AI Launcher — okienko: gdzie i z jakim kontem uruchomić Claude Code / Gemini / Happy"
sprawdz    = "test -f ~/.local/share/ailauncher/ailauncher.py && test -f ~/.local/share/ailauncher/ailauncher.png && test -f ~/.local/share/applications/ailauncher.desktop && grep -q 'ailauncher/ailauncher.png' ~/.local/share/applications/ailauncher.desktop"
zainstaluj = "bash ~/AI-katalog-roboczy/12_Narzedzia-AI/AILauncher_V2/linux/install.sh"
# Launcher nie ma wlasnego numeru wersji (brak --version w ailauncher.py), a panel bez pola
# `wersja` pokazuje „?”. Bierzemy wiec 8 znakow sumy kontrolnej ZAINSTALOWANEGO pliku:
# jest zawsze dostepna, zmienia sie razem z trescia i da sie POROWNAC miedzy maszynami
# (rozny skrot = rozne wersje launchera). [258] drobiazg, 2026-08-29.
wersja     = "sha256sum ~/.local/share/ailauncher/ailauncher.py | cut -c1-8"
wymaga     = ["katalog-roboczy",
              "~/AI-katalog-roboczy/12_Narzedzia-AI/AILauncher_V2/linux/install.sh",
              "~/AI-katalog-roboczy/12_Narzedzia-AI/AILauncher_V2/linux/ailauncher.png"]
uwagi      = "[252] 2026-08-29 — pierwsza pozycja kanału. Źródło w katalogu roboczym (repo 12_Narzedzia-AI). `sprawdz` pilnuje też ikony i ścieżki ikony w .desktop (uzup. 1 Architekta): stare instalacje z ikoną pod ~/.local/share/applications/2026-08-22_20-40.png wychodzą jako rozbieżność i sync je wyrównuje ponownym install.sh. python3-tk NIE jest tu dostawiany — to osobna pozycja apt lustra (jest w dzienniku V/K/HP), install.sh zastaje go na miejscu."

[[skrypt]]
id         = "vnc-handler"
opis       = 'Obsługa odsyłaczy vnc:// — przycisk „otwórz w programie” w panelu menadżera sieci'
sprawdz    = 'test -x ~/bin/vnc-otworz.sh && test -f ~/.local/share/applications/vnc-otworz.desktop && command -v vncviewer >/dev/null && grep -qs "^x-scheme-handler/vnc=vnc-otworz.desktop" ~/.config/mimeapps.list'
zainstaluj = "bash ~/bin/vnc-rejestruj.sh"
wersja     = "sha256sum ~/bin/vnc-otworz.sh | cut -c1-8"
usun       = "bash ~/bin/vnc-rejestruj.sh --wyrejestruj"
wymaga     = ["~/bin/vnc-otworz.sh",
              "~/bin/vnc-rejestruj.sh",
              "~/bin/schemat-rejestruj.sh",
              "~/.local/share/applications/vnc-otworz.desktop"]
uwagi      = """[258b] 2026-08-29 — kontrakt z panelem menadżera sieci (obszar 1): panel generuje wyłącznie `vnc://<adres>` (BEZ portu i BEZ użytkownika), stacja dokłada użytkownika z `maszyny.toml` i port 5900, i łączy się TUNELEM SSH (`vncviewer -via <user>@<adres> localhost:5900`, TigerVNC). Uwierzytelnieniem jest klucz SSH — hasła VNC nie ma ([258a]). Trzy pliki wozi chezmoi (`bin/vnc-otworz.sh`, `bin/vnc-rejestruj.sh`, `.local/share/applications/vnc-otworz.desktop`) — dlatego są w `wymaga`: przed pierwszym `chezmoi apply` pozycja jest ODŁOŻONA, nie błędna. Sama instalacja to wyłącznie REJESTRACJA schematu (`xdg-mime default` + zapasowo wpis w `~/.config/mimeapps.list`) — to akcja, nie plik, więc chezmoi jej nie zrobi. Klient: pakiet apt `tigervnc-viewer` (jest w dzienniku wszystkich stacji od 27.08); `sprawdz` pilnuje też jego obecności, żeby brak klienta wychodził jako rozbieżność, a nie jako martwy odsyłacz."""

[[skrypt]]
id         = "ssh-handler"
opis       = 'Obsługa odsyłaczy ssh:// — przycisk „terminal SSH” w panelu menadżera sieci'
sprawdz    = 'test -x ~/bin/ssh-otworz.sh && test -x ~/bin/schemat-rejestruj.sh && test -f ~/.local/share/applications/ssh-otworz.desktop && command -v ssh >/dev/null && grep -qs "^x-scheme-handler/ssh=ssh-otworz.desktop" ~/.config/mimeapps.list'
zainstaluj = "bash ~/bin/schemat-rejestruj.sh x-scheme-handler/ssh ssh-otworz.desktop"
wersja     = "sha256sum ~/bin/ssh-otworz.sh | cut -c1-8"
usun       = "bash ~/bin/schemat-rejestruj.sh x-scheme-handler/ssh ssh-otworz.desktop --wyrejestruj"
wymaga     = ["~/bin/ssh-otworz.sh",
              "~/bin/schemat-rejestruj.sh",
              "~/.local/share/applications/ssh-otworz.desktop"]
uwagi      = """[260b] 2026-08-29, decyzja usera („w menadżerze powinien być przycisk do uruchamiania terminala z ssh do maszyny"). Kontrakt z panelem menadżera sieci (obszar 1): panel generuje odsyłacz w standardowej postaci `ssh://user@host[:port]`; użytkownik jest OPCJONALNY — gdy go nie ma, stacja dokłada go z `lustra/maszyny.toml` (pole `user`, domyślnie `mk`; Asus ma `kiosk`), port domyślny 22. Dokładnie ta sama zasada co w `vnc-handler`. Skrypt otwiera TERMINAL użytkownika z `ssh -t -o StrictHostKeyChecking=accept-new`; który terminal — dana, nie kod: kolejno `LUSTRO_TERMINAL`, plik `~/.config/lustro/terminal`, `x-terminal-emulator` (na naszych stacjach → gnome-terminal), lista awaryjna. Gdy połączenie padnie od razu, okno czeka na Enter, żeby user zdążył przeczytać błąd. UWAGA: schemat `ssh://` ma w Ubuntu domyślnego obsługiwacza `ktelnetservice5.desktop` (z pakietów KDE) — rejestracja go NADPISUJE w sekcji [Default Applications] pliku ~/.config/mimeapps.list. Rejestrację robi wspólny `~/bin/schemat-rejestruj.sh` (schemat i plik .desktop to argumenty = dane); `~/bin/vnc-rejestruj.sh` jest od [258f] tylko nakładką na niego."""

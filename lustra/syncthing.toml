# HP dostaje NOWĄ tożsamość Syncthinga (tożsamość węzła powstaje na miejscu, spec 7.6),
# a stary wpis „lapekhp" na serwerze/Vostro/Katanie do skasowania — obszar 4.

[[urzadzenie]]
klucz = "hp"
id = "BXO5NNV-4663TVA-L4R45LA-EBGD2DP-5ZVOR5P-CST6JTE-TVFALDO-CRIWMQ3"
nazwa = "hp"
adresy = ["tcp://192.168.1.65:22000", "tcp://100.125.21.112:22000", "dynamic"]

[[folder]]
id = "ai-katalog-roboczy"
etykieta = "AI-katalog-roboczy"
sciezka = "~/AI-katalog-roboczy"
wersjonowanie = "staggered"
parametry = { maxAge = "2592000" }
stignore = [
  "(?d).DS_Store", "(?d)desktop.ini", "(?d)Thumbs.db", "node_modules", "__pycache__",
  "*-MK_HOST_VOSTRO*", "~$*", "*.tmp", "**/*:*", "**/~BROMIUM",
]

[[folder]]
id = "duperele"
etykieta = "Duperele"
sciezka = "$PULPIT/Duperele"
wersjonowanie = "trashcan"
parametry = { cleanoutDays = "7" }
stignore = []

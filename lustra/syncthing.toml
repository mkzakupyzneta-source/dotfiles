id = "M63FMYQ-ASP5TKH-OSLJXFI-4DGFBJP-R4NWIEB-F43G2IL-ZR2RYMI-V7S3VA2"
nazwa = "vostro"
adresy = ["tcp://192.168.1.60:22000", "tcp://100.100.178.56:22000", "dynamic"]

[[urzadzenie]]

# Syncthing — DANE do dołączania nowej stacji (obszar 4_Kanaly_danych = treść,
# obszar 5_Wspolna_konfiguracja = format i użycie). Stan: 2026-08-27, przepisany
# z żywej konfiguracji serwera (REST /rest/config) i pamięci obszaru 4 ([135], [196]).
#
# Kto to czyta:
#   • nowa-stacja.sh (przez stacja-dane.py syncthing-konfiguruj) — na NOWEJ stacji
#     dopisuje poniższe urządzenia i zakłada poniższe foldery (ścieżki, wersjonowanie,
#     .stignore) w jej własnym Syncthingu;
#   • przyjmij-maszyne.sh (serwer) — dopisuje nową stację do tych samych folderów na
#     serwerze (i na innych stacjach, jeśli są osiągalne).
# Nowa maszyna w domu = nowy blok [[urzadzenie]] (robi to przyjmij-maszyne.sh).
# Nowy wspólny folder = nowy blok [[folder]]. Kodu nikt nie rusza.
#
# Ścieżka folderu: "~" = katalog domowy, "$PULPIT" = wynik `xdg-user-dir DESKTOP`.
# Wersjonowanie: parametry jako TEKST (tak przyjmuje REST API Syncthinga).

wersja = 1

[[urzadzenie]]
klucz = "serwer"
id = "O37SSQI-JJWJIHU-YZNDRP7-GRRPQDB-ZAJE4CU-4KPIQVD-DHCKDMT-ZDQ4UQ7"
nazwa = "mk-OptiPlex-7050"
adresy = ["tcp://192.168.1.49:22000", "tcp://100.110.113.13:22000", "dynamic"]

[[urzadzenie]]

# Status pozycji lustra per maszyna — DANE pod MENADŻERA KONFIGURACJI [209]
# (pomysł usera 25.08: _POMYSLY/2026-08-25_menadzer-luster-tabela-maszyn.md;
# schemat rozszerzony 26.08 kontraktem [209] — patrz
# 10_Siec_domowa/5_Wspolna_konfiguracja/kontrakt-menadzer-konfiguracji-2026-08-26.md,
# rozdz. 2.2 i 3, ZATWIERDZONY 26.08).
#
# BRAK wpisu = status "wspolne" (domyślnie): pozycja bierze udział w normalnym
# konsensusie lustra. Wpis robi się tylko dla odstępstw:
#
# [[pozycja]]
# kanal   = "apt" | "snap" | "flatpak" | "gnome-extension"
# id      = "identyfikator pakietu / uuid rozszerzenia"
# status  = "testowe"      → KWARANTANNA: automat NIE proponuje instalacji na innych
#                            maszynach (sync/status pomijają rozbieżność, `lustro lista`
#                            nie wpisuje pozycji do packages.yaml, więc bootstrap nowej
#                            maszyny też jej nie stawia). Ma PIERWSZEŃSTWO przed
#                            wszystkim poniższym (override się nawet nie odczytuje,
#                            dopóki trwa kwarantanna). User „puszcza" pozycję po
#                            weryfikacji, KASUJĄC wpis (wraca do "wspolne").
# wylacznie_na = ["klucz_maszyny", ...]
#                            → konsensus lustra dla TEJ pozycji liczony tylko
#                            w przecięciu z wymienionymi maszynami (zamiast
#                            propagować się na każdego członka lustra). Uwaga:
#                            to ogranicza KONSENSUS, nie działa samo z siebie na
#                            maszynie spoza lustra — dla „jedna pozycja na jednej
#                            maszynie nie-lustro" właściwe narzędzie to `override`
#                            poniżej, nie to pole (kontrakt rozdz. 8, przypadek 5).
# uwagi   = dla człowieka (po co, od kiedy) — dotyczy całej pozycji
#
#   [[pozycja.override]]
#   maszyna = "klucz_maszyny"     (z lustra/maszyny.toml, pole `klucz`)
#   stan    = "obecne" | "nieobecne"
#   uwagi   = dla człowieka (po co, od kiedy — per wpis)
#
# `override` to jawne, KIERUNKOWE nadpisanie dla JEDNEJ pary (pozycja, maszyna).
# Wygrywa ZAWSZE, niezależnie od tego, czy ta maszyna jest członkiem lustra
# (kontrakt rozdz. 3, reguła 2) — to jedyne miejsce z dwukierunkowością:
#   • "nieobecne" na maszynie-członku lustra → ta maszyna świadomie NIE ma mieć
#     tej pozycji, mimo że reszta lustra ją ma. Bierne WYCISZENIE: `sync --auto`
#     nigdy nic nie odinstalowuje (jak wszędzie), apka po prostu przestaje
#     o tej pozycji tu wspominać.
#   • "obecne" na maszynie, która NIE jest członkiem lustra → ta jedna pozycja
#     ma być zainstalowana też TAM, mimo że maszyna poza tym nic z lustra nie
#     dostaje. `sync --auto` ją tam zainstaluje (jedyny sposób, w jaki automat
#     działa na maszynie spoza lustra — wyłącznie przez jawny override).
# Dokładnie JEDEN wpis `[[pozycja.override]]` na parę (pozycja, maszyna) — DWA
# sprzeczne wpisy dla tej samej pary to TWARDY BŁĄD wczytania (apka odmawia
# uruchomienia z czytelnym komunikatem), nie cichy wybór ostatniego (kontrakt
# rozdz. 8, przypadek 3).
#
# Różnica wobec pomijane-<maszyna>.txt: tamten plik to LOKALNA decyzja jednej
# maszyny („nie pytaj mnie więcej", niecommitowany, niewidoczny dla panelu);
# `override` tutaj to WSPÓLNE dane floty — widzą go wszystkie maszyny i panel
# menadżera sieci [202] (kontrakt rozdz. 8, przypadek 13).
#
# Historia: do 26.08 istniało tu płaskie pole `status = "wyjatek"` + `maszyna`
# (bez kierunku — tylko wyciszało rozbieżność). Zastąpione przez `override`
# kontraktem [209]; ten plik był wtedy pusty, więc migracja to zero wierszy.
#
# (na razie pusto — czeka na pierwszą pozycję)


# --- [221] zdalny pulpit — 2026-08-27, obszar 2_Stacje_lustra -----------------------
# Na stacjach (Vostro, Katana) x11vnc i tigervnc-viewer ida zwyklym konsensusem lustra
# (`lustro dodaj` na Vostro → `sync` na Katanie). Serwer NIE jest czlonkiem lustra,
# wiec dostaje obie pozycje jawnym `override obecne` (kontrakt [209], rozdz. 3):
# decyzja usera 27.08 — podglad ekranu ma byc tez na serwerze, klient „nie zaszkodzi".

[[pozycja]]
kanal  = "apt"
id     = "x11vnc"
uwagi  = "[221] zdalny pulpit do zywej sesji X — usluga user zdalny-pulpit.service (chezmoi)"

  [[pozycja.override]]
  maszyna = "serwer"
  stan    = "obecne"
  uwagi   = "2026-08-27 obszar 2 — serwer tez ma miec podglad ekranu (decyzja usera [221])"

[[pozycja]]
kanal  = "apt"
id     = "tigervnc-viewer"
uwagi  = "[221] klient VNC — do podgladu innych maszyn domowych"

  [[pozycja.override]]
  maszyna = "serwer"
  stan    = "obecne"
  uwagi   = "2026-08-27 obszar 2 — „nie zaszkodzi” (user)"

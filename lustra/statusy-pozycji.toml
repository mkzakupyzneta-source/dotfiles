# Status pozycji lustra per maszyna — DANE pod przyszłego MENADŻERA LUSTER
# (pomysł usera 25.08: _POMYSLY/2026-08-25_menadzer-luster-tabela-maszyn.md;
# plan automatu 25.08, poprawka 11). Sam menadżer (tabela program × maszyna)
# to faza przyszła — TERAZ istnieje tylko struktura danych i jej honorowanie.
#
# BRAK wpisu = status "wspolne" (domyślnie): pozycja propaguje się na wszystkie
# stacje. Wpis robi się tylko dla odstępstw:
#
# [[pozycja]]
# kanal   = "apt" | "snap" | "flatpak" | "gnome-extension"
# id      = "identyfikator pakietu / uuid rozszerzenia"
# status  = "testowe"   → KWARANTANNA: automat NIE proponuje instalacji na innych
#                         maszynach (sync/status pomijają rozbieżność, `lustro lista`
#                         nie wpisuje pozycji do packages.yaml, więc bootstrap nowej
#                         maszyny też jej nie stawia). User „puszcza" pozycję po
#                         weryfikacji, KASUJĄC wpis (wraca do "wspolne").
#           "wyjatek"   → maszyna z pola `maszyna` świadomie odstaje (w obie strony:
#                         ani nie instalujemy tam, ani nie zgłaszamy nadmiaru);
#                         puste/brak pole maszyna = wyjątek na każdej maszynie.
# maszyna = której maszyny dotyczy (dla "testowe" informacyjnie: gdzie testowane)
# uwagi   = dla człowieka (po co, od kiedy)
#
# Różnica wobec pomijane-<maszyna>.txt: tamten plik to LOKALNA decyzja jednej
# maszyny („nie pytaj mnie więcej"); ten plik to WSPÓLNE dane floty — widzą go
# wszystkie maszyny i przyszły menadżer.
#
# (na razie pusto — czeka na pierwszą pozycję)

[[pozycja]]
kanal   = "apt"
id      = "jq"
status  = "testowe"
maszyna = ""
uwagi   = "ustawione z panelu menadżera sieci (obszar 1_Serwer), 2026-08-26 18:51"

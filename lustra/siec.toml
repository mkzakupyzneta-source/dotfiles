# Sieć domowa — DANE, nie kod (poprawka 7 planu 25.08, brak 17 z Katany).
#
# Dom ma DWIE podsieci LAN: kabel 192.168.1.x i Wi-Fi 192.168.100.x. Maszyna bywa
# raz w jednej, raz w drugiej (adres Wi-Fi bywa zmienny — 25.08 Katana sama była
# chwilowo w .1.x), więc reguły zapory stacji muszą wpuszczać OBIE. Dawny wzorzec
# zakładał jedną zaszytą podsieć (192.168.1.0/24) — przez to maszyny na Wi-Fi
# nie dogadywały się po LAN z maszynami na kablu.
#
# Kto to czyta:
#   • lustra/ufw-stacja.sh — buduje z tej listy reguły ufw stacji (wzorzec reguł:
#     audyt Vostro 24.08, 7_Bezpieczenstwo/zapora-vostro-audyt-2026-08-24.md),
#   • procedura-nowej-stacji.md (Etap 2) — odsyła tutaj zamiast wpisywać adresy.
#
# Nowa podsieć w domu = nowa pozycja TUTAJ (i przelanie reguł ufw-stacja.sh),
# bez ruszania kodu.

podsieci_lan = ["192.168.1.0/24", "192.168.100.0/24", "192.168.122.0/24"]  # 192.168.122.0/24 = sieć libvirt poligonu (VM na serwerze) — usunąć po testach T7 (27.08)

# ── Panel menadzera sieci — GDZIE stoi i JAK go otworzyc ([262], 2026-08-29) ──
# Uslugę serwuje `menadzer-sieci.service` na serwerze (/srv/uslugi/menadzer-sieci/app.py,
# obszar 1_Serwer; port jest tam dzis stala `PORT = 8100`). Stacje maja skrot na pasku —
# pozycja `panel-sieci` kanalu `skrypt` (lustra/skrypty.toml) + ~/bin/panel-sieci.sh,
# ktory czyta te sekcje. Przeprowadzka panelu albo zmiana portu = zmiana TYCH danych,
# skryptu nikt nie rusza.
[panel]
maszyna = "serwer"     # `klucz` bloku [[maszyna]] w lustra/maszyny.toml
port    = 8100         # zgodne z `PORT` w app.py panelu (obszar 1) — sprawdzone 2026-08-29
sciezka = "/"
tryb    = "app"        # "app" = osobne okno Chrome bez paska adresu (wlasna ikona w doku),
                       # "karta" = zwykla karta w domyslnej przegladarce (xdg-open).
                       # Brak Chrome'a na maszynie = automatyczny fallback na "karta".
# Kolejnosc pol adresu z maszyny.toml — pierwsze wypelnione wygrywa. TAILSCALE JEST PIERWSZY
# celowo: przyciski panelu („Pulpit", „terminal SSH") generuja odsylacze do adresow Tailscale
# floty, wiec panel otwarty po LAN dzialalby poprawnie tylko w domu. Dopisanie "host_lan"
# na koniec listy to zmiana danych, nie kodu.
pola_adresu = ["ip_tailscale", "host_tailscale"]

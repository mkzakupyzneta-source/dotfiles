# Sieć domowa — DANE, nie kod (poprawka 7 planu 25.08, brak 17 z Katany).
#
# Kto to czyta:
#   • lustra/ufw-stacja.sh — buduje z tych list reguły ufw stacji (wzorzec reguł:
#     audyt Vostro 24.08, 7_Bezpieczenstwo/zapora-vostro-audyt-2026-08-24.md),
#   • procedura-nowej-stacji.md (Etap 2) — odsyła tutaj zamiast wpisywać adresy.
#
# DWIE listy, bo podsieć ma w tym mechanizmie DWA stany, a nie jeden:
#   `podsieci_lan`       — podsieci domowe, do których wpuszczamy ruch (reguły zakładane),
#   `podsieci_wycofane`  — podsieci, które KIEDYŚ tu były i których reguły mają ze stacji
#                          ZNIKNĄĆ. Zapora nie sprząta po sobie sama: skasowanie linii
#                          z `podsieci_lan` zostawiłoby na każdej maszynie komplet starych
#                          reguł `ufw allow from …` na zawsze.
# Wycofanie podsieci = PRZENIESIENIE jednej linii z pierwszej listy do drugiej. Kod bez zmian.
# Wpis z listy wycofanych wolno skasować dopiero wtedy, gdy `ufw-stacja.sh --wykonaj`
# przebiegł na WSZYSTKICH maszynach (dziś: hp, vostro, katana).

podsieci_lan = ["192.168.1.0/24"]

# Podsieci wycofane — patrz wyżej. Data i powód przy każdej pozycji, żeby nikt nie
# przywrócił ich „bo pewnie po coś były".
podsieci_wycofane = [
  # 192.168.100.0/24 — NIE jest podsiecią domową. Zmierzone przez obszar 6_Dostep_zdalny
  #   30.08: to sieć firmowa ANV, do której HP/Katana wpinały się poza domem. Wpisana tu
  #   25.08 przy okazji „domu z dwiema podsieciami" (Katana chodziła wtedy po Wi-Fi
  #   z adresem .100.x) — błędna diagnoza, dom ma JEDNĄ podsieć 192.168.1.0/24 na kablu
  #   i na Wi-Fi. Decyzja Architekta 30.08 [286]: zdejmujemy z zapory i z panelu.
  "192.168.100.0/24",
  # 192.168.122.0/24 — sieć libvirt maszyny wirtualnej poligonu na serwerze. VM skasowana,
  #   podsieć nie istnieje ([286], 30.08). Miała zniknąć „po testach T7" już 27.08.
  "192.168.122.0/24",
]

# ── Panel menadzera sieci — GDZIE stoi i JAK go otworzyc ([262], 2026-08-29) ──
# Uslugę serwuje `menadzer-sieci.service` na serwerze (/srv/uslugi/menadzer-sieci/app.py,
# obszar 1_Serwer; port jest tam dzis stala `PORT = 8100`). Stacje maja skrot na pasku —
# pozycja `panel-sieci` kanalu `skrypt` (lustra/skrypty.toml) + ~/bin/panel-sieci.sh,
# ktory czyta te sekcje. Przeprowadzka panelu albo zmiana portu = zmiana TYCH danych,
# skryptu nikt nie rusza.
[panel]
maszyna = "serwer"     # `klucz` bloku [[maszyna]] w lustra/maszyny.toml
port    = 8100         # zgodne z `PORT` w app.py panelu (obszar 1) — sprawdzone 2026-08-29
sciezka = "/"
tryb    = "app"        # "app" = osobne okno Chrome bez paska adresu (wlasna ikona w doku),
                       # "karta" = zwykla karta w domyslnej przegladarce (xdg-open).
                       # Brak Chrome'a na maszynie = automatyczny fallback na "karta".
# Kolejnosc pol adresu z maszyny.toml — pierwsze wypelnione wygrywa. TAILSCALE JEST PIERWSZY
# celowo: przyciski panelu („Pulpit", „terminal SSH") generuja odsylacze do adresow Tailscale
# floty, wiec panel otwarty po LAN dzialalby poprawnie tylko w domu. Dopisanie "host_lan"
# na koniec listy to zmiana danych, nie kodu.
pola_adresu = ["ip_tailscale", "host_tailscale"]
